<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张氏家谱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #121212 0%, #050505 100%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #d4af37;
    }

    .wall {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .title {
      position: absolute;
      top: 12%;
      font-size: 22px;
      letter-spacing: 8px;
      color: #d4af37;
      opacity: 0.85;
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
    }

    .scene {
      width: 220px;
      height: 220px;
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    .cube {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      /* 初始倾斜，一次看见正面、右面、顶面三面 */
      transform: rotateY(-35deg) rotateX(25deg);
      animation: rotateCube 8s infinite ease-in-out;
    }

    .face {
      position: absolute;
      width: 220px;
      height: 220px;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow:
        inset 0 0 35px rgba(212, 175, 55, 0.08),
        0 0 25px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 6px;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
      backface-visibility: visible;
    }

    .front {
      transform: translateZ(110px);
      background: radial-gradient(circle at center, #2a2208 0%, #0d0d0d 100%);
      cursor: pointer;
    }
    .back {
      transform: rotateY(180deg) translateZ(110px);
      font-size: 18px;
      letter-spacing: 4px;
      color: #9f8a44;
      cursor: default;
    }
    .left {
      transform: rotateY(-90deg) translateZ(110px);
      background: linear-gradient(135deg, #141414 0%, #070707 100%);
      cursor: default;
    }
    .right {
      transform: rotateY(90deg) translateZ(110px);
      background: linear-gradient(135deg, #141414 0%, #070707 100%);
      cursor: default;
    }
    .top {
      transform: rotateX(90deg) translateZ(110px);
      background: linear-gradient(135deg, #181818 0%, #080808 100%);
      cursor: default;
    }
    .bottom {
      transform: rotateX(-90deg) translateZ(110px);
      background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
      cursor: default;
    }

    @keyframes rotateCube {
      0%   { transform: rotateY(-35deg) rotateX(25deg); }
      40%  { transform: rotateY(145deg) rotateX(25deg); }
      50%  { transform: rotateY(145deg) rotateX(205deg); }
      90%  { transform: rotateY(-35deg) rotateX(205deg); }
      100% { transform: rotateY(-35deg) rotateX(25deg); }
    }

    .hash-ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 42%;
      background:
        linear-gradient(to top, rgba(212, 175, 55, 0.08) 0%, transparent 100%),
        repeating-linear-gradient(
          0deg,
          rgba(212, 175, 55, 0.06) 0px,
          rgba(212, 175, 55, 0.06) 1px,
          transparent 1px,
          transparent 40px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(212, 175, 55, 0.06) 0px,
          rgba(212, 175, 55, 0.06) 1px,
          transparent 1px,
          transparent 40px
        );
      transform: perspective(600px) rotateX(55deg);
      transform-origin: bottom;
      mask-image: linear-gradient(to top, black 40%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
      pointer-events: none;
    }

    .hash-mark {
      position: absolute;
      bottom: 18%;
      font-size: 13px;
      letter-spacing: 3px;
      color: #9f8a44;
      opacity: 0.75;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.25);
    }
    .hash-mark.left  { left: 12%; }
    .hash-mark.right { right: 12%; }
    .enter-hint {
      position: absolute;
      bottom: 10%;
      font-size: 14px;
      letter-spacing: 6px;
      color: #d4af37;
      opacity: 0.8;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }
  </style>
</head>

<body>
  <section class="wall">
    <div class="title">张氏家谱</div>

    <div class="scene">
      <div class="cube" id="cube">
        <div class="face front" id="enterFace">张</div>
        <div class="face back">INDEX WALL</div>
        <div class="face left"></div>
        <div class="face right"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>

    <div class="hash-ground"></div>
    <div class="hash-mark left">#02 INDEX WALL</div>
    <div class="hash-mark right">#01 FAMILY TREE</div>
    <div class="enter-hint">点击【张】这一面进入</div>
  </section>

  <script>
    const enterFace = document.getElementById('enterFace');
    const cube = document.getElementById('cube');

    enterFace.addEventListener('click', function () {
      cube.style.animation = 'none';
      cube.offsetHeight;
      cube.animate(
        [
          { transform: 'rotateY(-35deg) rotateX(25deg)', scale: 1 },
          { transform: 'rotateY(-35deg) rotateX(25deg) rotateY(360deg) rotateX(180deg)', scale: 1.35 }
        ],
        {
          duration: 900,
          easing: 'ease-in-out',
          fill: 'forwards'
        }
      ).onfinish = function () {
        window.location.href = 'index01.html';
      };
    });
  </script>
</body>
</html>
