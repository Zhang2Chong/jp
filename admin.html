<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增族人资料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  padding:20px 10px;
}
.top-links{
  display:flex;
  justify-content:space-between;
  margin-bottom:25px;
}
.top-links a{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}

.form-container{
  max-width:420px;
  margin:0 auto;
  background:#2b2b2b;
  border-radius:8px;
  padding:25px 15px;
}
h2{
  text-align:center;
  font-size:20px;
  margin-bottom:25px;
  color:#ffcc44;
}

.form-row{
  display:flex;
  align-items:center;
  margin-bottom:14px;
  padding-left:5ch;
}
.form-label{
  width:90px;
  color:#ddd;
  flex-shrink:0;
}
.form-input{
  flex:1;
  padding:8px 10px;
  border:1px solid:#555;
  border-radius:4px;
  background:#333;
  color:#fff;
  font-size:15px;
}
.form-input:read-only{
  background:#2a2a2a;
  color:#aaa;
  border-color:#444;
}

.btn-submit{
  width:100%;
  padding:12px;
  background:#e64a19;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:17px;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="top-links">
  <a href="index.html">← 返回主页</a>
  <a href="javascript:history.back()">← 返回上一页</a>
</div>

<div class="form-container">
  <h2>新增族人资料</h2>

  <form id="addForm">
    <div class="form-row">
      <div class="form-label">华文名字</div>
      <input type="text" class="form-input" id="name" maxlength="2" required>
    </div>

    <div class="form-row">
      <div class="form-label">父亲名字</div>
      <input type="text" class="form-input" id="fatherName" readonly>
    </div>

    <div class="form-row">
      <div class="form-label">排行</div>
      <input type="text" class="form-input" id="birthOrder" placeholder="如：1、2、Ⅰ、Ⅱ">
    </div>

    <div class="form-row">
      <div class="form-label">世代</div>
      <input type="text" class="form-input" id="generation" readonly>
    </div>

    <div class="form-row">
      <div class="form-label">妻子名字</div>
      <input type="text" class="form-input" id="wifeName" placeholder="可空">
    </div>

    <div class="form-row">
      <div class="form-label">儿子数量</div>
      <input type="number" class="form-input" id="sonCount" min="0" value="0">
    </div>

    <div class="form-row">
      <div class="form-label">备注</div>
      <input type="text" class="form-input" id="notes" placeholder="可空">
    </div>

    <button type="submit" class="btn-submit">提交资料</button>
  </form>
</div>

<script>
// 读取 URL 参数传过来的父亲信息
const params = new URLSearchParams(window.location.search);
const fatherId = params.get('fatherId');
const fatherName = params.get('fatherName');
const fatherGen = params.get('generation');

if(fatherName){
  document.getElementById('fatherName').value = fatherName;
}
if(fatherGen){
  document.getElementById('generation').value = parseInt(fatherGen) + 1;
}

// 提交
document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('资料已提交！\n名字：' + document.getElementById('name').value);
  history.back();
});
</script>

</body>
</html>
