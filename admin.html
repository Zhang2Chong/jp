<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>新增张氏族人</title>
<style>
*{box‑sizing:border‑box;margin:0;padding:0}
body{background:#111;color:#ffdd66;font‑family:Microsoft YaHei,sans‑serif;padding:20px 10px}
.container{max‑width:720px;margin:0 auto;background:#222;padding:25px;border‑radius:12px}
h2{text‑align:center;margin‑bottom:20px}
input,select,textarea{width:100%;padding:10px;margin:8px 0 16px 0;border‑none;border‑radius:6px}
button{width:100%;padding:12px;background:#b8860b;color:white;border:none;border‑radius:6px;font‑size:18px}
</style>
</head>
<body>
<div class="container">
<h2>🔐 输入家族密码</h2>
<input type="password" id="pwd" placeholder="请输入家族密码">
<hr>
<h2>👤 新增族人资料</h2>
<input type="text" id="no" placeholder="人员编号">
<input type="text" id="father" placeholder="父亲编号">
<input type="text" id="rank" placeholder="排行">
<input type="text" id="chineseName" placeholder="华文名字">
<input type="text" id="generation" placeholder="字辈">
<input type="text" id="englishName" placeholder="英文名字">
<input type="text" id="wife" placeholder="妻子名字">
<input type="number" id="sonCount" placeholder="儿子数量">
<input type="text" id="photoLink" placeholder="相片链接">
<textarea id="note" placeholder="备注"></textarea>
<button onclick="submitData()">提交资料</button>
</div>
<script>
async function submitData(){
  const data={
    pwd:document.getElementById("pwd").value,
    no:document.getElementById("no").value,
    father:document.getElementById("father").value,
    rank:document.getElementById("rank").value,
    chineseName:document.getElementById("chineseName").value,
    generation:document.getElementById("generation").value,
    englishName:document.getElementById("englishName").value,
    wife:document.getElementById("wife").value,
    sonCount:document.getElementById("sonCount").value,
    photoLink:document.getElementById("photoLink").value,
    note:document.getElementById("note").value
  }
  alert("资料已提交等待后台校验！")
  console.log(data)
}
</script>
</body>
</html>
