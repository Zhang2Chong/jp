<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  margin:0;
}
.page-container{
  display:flex;
  height:100vh;
  overflow:hidden;
}
.left-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-right:1px solid #444;
  overflow-y:auto;
}
.center-panel{
  width:50%;
  display:flex;
  flex-direction:column;
  background:#1a1a1a;
}
.right-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-left:1px solid #444;
  overflow-y:auto;
}
.panel-title{
  font-size:20px;
  color:#ff8800;
  margin-bottom:20px;
  text-align:center;
}
.placeholder{
  color:#888;
  text-align:center;
  padding:40px 20px;
  border:1px dashed #444;
  border-radius:8px;
  min-height:200px;
}
.frame-nav{
  padding:12px 16px;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  gap:16px;
}
.back-link{
  color:#ff8800;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
  flex-shrink:0;
}
.frame-title{
  color:#ffdd66;
  font-size:18px;
  font-weight:bold;
}
.content-frame{
  flex:1;
  border:none;
  background:#1a1a1a;
}

/* 手机：直接跳转到 browse 简单版，不显示三栏 */
@media (max-width:900px){
  .page-container{display:block}
  .left-panel,.right-panel{display:none}
  .center-panel{width:100%;height:100vh;}
}
</style>
</head>
<body>

<!-- 电脑：三栏布局 -->
<div class="page-container">

  <!-- 左边：音乐区（一直不动） -->
  <div class="left-panel">
    <h3 class="panel-title">🎵 音乐</h3>
    <div class="placeholder">
      这里放音乐<br>
      待你后续添加
    </div>
  </div>

  <!-- 中间：可以切换内容的区域 -->
  <div class="center-panel">
    <div class="frame-nav">
      <span class="back-link" onclick="switchContent('home')">← 返回</span>
      <span class="frame-title" id="frameTitle">张氏家谱</span>
    </div>
    <iframe id="mainFrame" class="content-frame" src="frame-home.html" title="主内容区"></iframe>
  </div>

  <!-- 右边：祖先资料（一直不动） -->
  <div class="right-panel">
    <h3 class="panel-title">先祖简介</h3>
    <div class="placeholder">
      这里放祖先资料<br>
      待你后续添加
    </div>
  </div>

</div>

<script>
function switchContent(mode){
  const frame = document.getElementById('mainFrame');
  const title = document.getElementById('frameTitle');
  if(mode === 'home'){
    frame.src = 'frame-home.html';
    title.innerText = '张氏家谱';
  }else if(mode === 'browse'){
    frame.src = 'browse.html';
    title.innerText = '世代族谱';
  }
}
</script>

</body>
</html>
