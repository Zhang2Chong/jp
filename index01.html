<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两人血缘对比 - 电脑版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  padding:16px;
}
.wrapper{
  max-width:1400px;
  margin:0 auto;
  width:100%;
}
h1{
  text-align:center;
  font-size:24px;
  margin-bottom:20px;
  color:#ffcc44;
}
.main-layout{
  display:flex;
  gap:16px;
  align-items:flex-start;
}

/* ===== 左边栏 & 右边栏：各5个空位 ===== */
.side-column{
  width:200px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
}
.side-slot{
  background:#252525;
  border:1px dashed #555;
  border-radius:6px;
  padding:20px 10px;
  text-align:center;
  color:#777;
  font-size:14px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== 中间：iframe 区域 ===== */
.center-column{
  flex:1;
  min-width:0;
}
.iframe-container{
  border:1px solid #444;
  border-radius:6px;
  overflow:hidden;
  background:#000;
}
.center-column iframe{
  width:100%;
  height:800px;
  border:none;
  display:block;
}

/* ===== 手机上自动变回上下排列 ===== */
@media (max-width:900px){
  .main-layout{
    flex-direction:column;
  }
  .side-column{
    width:100%;
    flex-direction:row;
    flex-wrap:wrap;
  }
  .side-slot{
    flex:1 1 calc(20% - 8px);
    min-width:120px;
  }
}
</style>
</head>
<body>
<div class="wrapper">

  <h1>📜 两人血缘对比 · 扩展版</h1>

  <div class="main-layout">
    <!-- 左边：5个空位 -->
    <div class="side-column">
      <div class="side-slot">左侧位置 1</div>
      <div class="side-slot">左侧位置 2</div>
      <div class="side-slot">左侧位置 3</div>
      <div class="side-slot">左侧位置 4</div>
      <div class="side-slot">左侧位置 5</div>
    </div>

    <!-- 中间：iframe 嵌入对比页面 -->
    <div class="center-column">
      <div class="iframe-container">
        <iframe src="index.html" title="血缘对比"></iframe>
      </div>
    </div>

    <!-- 右边：5个空位 -->
    <div class="side-column">
      <style>
.side-slot-auth{
  background:#252525;
  border:1px solid #444;
  border-radius:6px;
  padding:14px 10px;
  text-align:center;
  min-height:70px;
  color:#ddd;
  font-size:14px;
}
.side-slot-auth button{
  background:#0088ff;
  color:#fff;
  border:none;
  border-radius:4px;
  padding:8px 16px;
  margin-top:10px;
  cursor:pointer;
  font-size:14px;
}
.side-slot-auth button.secondary{
  background:#444;
  margin-left:8px;
}
.side-slot-auth input{
  background:#333;
  border:1px solid #555;
  color:#fff;
  border-radius:4px;
  padding:6px 8px;
  margin:8px 4px;
  width:70%;
  font-size:14px;
}
.side-slot-auth .id-display{
  color:#4da6ff;
  font-weight:bold;
  margin:6px 0;
}
.side-slot-auth .status-text{
  color:#aaa;
  font-size:12px;
  margin-top:6px;
}
</style>

<div class="side-slot-auth" id="authBlock">
  <div id="auth-step1">
    <div>🔐 操作身份确认</div>
    <div class="status-text">查看模式 · 未登录</div>
    <button onclick="checkLogin()">检查 / 登录 GitHub</button>
  </div>

  <div id="auth-step2" style="display:none;">
    <div>👤 你是谁？</div>
    <input type="text" id="inputName" placeholder="请输入你的姓名">
    <br>
    <button onclick="confirmName()">确认姓名</button>
    <button class="secondary" onclick="resetAuth()">取消</button>
  </div>

  <div id="auth-step3" style="display:none;">
    <div>✅ 欢迎，<span id="displayName" class="id-display"></span></div>
    <div class="status-text">已记录 · 提交时会连同身份一起发送</div>
    <button onclick="changeName()">更换姓名</button>
  </div>
</div>

<script>
// 存储当前使用者信息
let currentUser = {
  githubId: null,
  name: null,
  hasAccess: false
};

// 步骤1：检查登录状态
function checkLogin(){
  // 这里以后可以接入 GitHub 登录
  // 现在先模拟：显示"请输入姓名"界面
  document.getElementById('auth-step1').style.display = 'none';
  document.getElementById('auth-step2').style.display = 'block';
  document.getElementById('inputName').focus();
}

// 步骤2：确认姓名并检查权限
function confirmName(){
  const name = document.getElementById('inputName').value.trim();
  if(!name){
    alert('请输入姓名');
    return;
  }
  
  currentUser.name = name;
  
  // ✅ 这里以后会连接你的 YAML/CSV 检查权限
  // 现在先：记录名字 → 显示欢迎界面
  document.getElementById('auth-step2').style.display = 'none';
  document.getElementById('displayName').textContent = name;
  document.getElementById('auth-step3').style.display = 'block';
  
  console.log('✅ 用户已记录:', currentUser);
}

// 更换姓名
function changeName(){
  document.getElementById('auth-step3').style.display = 'none';
  document.getElementById('auth-step2').style.display = 'block';
  document.getElementById('inputName').value = currentUser.name || '';
  document.getElementById('inputName').focus();
}

// 重置
function resetAuth(){
  currentUser.name = null;
  document.getElementById('inputName').value = '';
  document.getElementById('auth-step2').style.display = 'none';
  document.getElementById('auth-step3').style.display = 'none';
  document.getElementById('auth-step1').style.display = 'block';
}

// 供以后调用：获取当前用户信息
function getCurrentUser(){
  return currentUser;
}
</script>

      <div class="side-slot">右侧位置 2</div>
      <div class="side-slot">右侧位置 3</div>
      <div class="side-slot">右侧位置 4</div>
      <div class="side-slot">右侧位置 5</div>
    </div>
  </div>

</div>
</body>
</html>
