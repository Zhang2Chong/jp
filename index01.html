<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#ffdd66;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  margin:0;
}
.page-container{
  display:flex;
  min-height:100vh;
}
.left-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-right:1px solid #444;
}
.center-panel{
  width:50%;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:100vh;
}
.right-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-left:1px solid #444;
}
.panel-title{
  font-size:20px;
  color:#ff8800;
  margin-bottom:20px;
  text-align:center;
}
.placeholder{
  color:#888;
  text-align:center;
  padding:40px 20px;
  border:1px dashed #444;
  border-radius:8px;
  min-height:200px;
}

/* === 首页样式 === */
.home-content{
  text-align:center;
}
h1{
  font-size:clamp(36px,12vw,52px);
  margin-bottom:16px;
  color:#ffdd66;
  letter-spacing:4px;
}
.author{
  font-size:clamp(20px,5vw,24px);
  margin-bottom:60px;
  color:#e2b558;
}
.btn{
  display:block;
  width:100%;
  max-width:400px;
  margin:18px auto;
  padding:22px;
  border:none;
  border-radius:12px;
  font-size:clamp(22px,6vw,28px);
  color:white;
  text-decoration:none;
  font-weight:bold;
}
.btn-1{background:#ff8800}
.btn-2{background:#2288ff}
.footer-note{
  margin-top:60px;
  padding-top:24px;
  border-top:1px solid #333;
  color:#999;
  font-size:14px;
  line-height:1.8;
  max-width:400px;
  margin-left:auto;
  margin-right:auto;
}

/* 手机自动改成上下排列 */
@media (max-width:768px){
  .page-container{flex-direction:column}
  .left-panel,.center-panel,.right-panel{width:100%}
  .left-panel,.right-panel{border:none;border-bottom:1px solid #444}
}
</style>
</head>
<body>
<div class="page-container">

  <!-- 左边 1/4：音乐区 -->
  <div class="left-panel">
    <h3 class="panel-title">🎵 音乐</h3>
    <div class="placeholder">
      这里放音乐<br>
      待你后续添加
    </div>
  </div>

  <!-- 中间 1/2：就是 index.html 首页内容 -->
  <div class="center-panel">
    <div class="home-content">
      <h1>张氏家谱</h1>
      <div class="author">编撰：张官来</div>

      <a class="btn btn-1" href="browse.html">📖 浏览世代族谱</a>
      <a class="btn btn-2" href="compare.html">⚖️ 两人血缘对比</a>

      <div class="footer-note">
        张氏家谱 · 编撰：张官来<br>
        所有内容仅供张氏族人查阅传承，保留所有权利
      </div>
    </div>
  </div>

  <!-- 右边 1/4：祖先信息 -->
  <div class="right-panel">
    <h3 class="panel-title">先祖简介</h3>
    <div class="placeholder">
      这里放祖先资料<br>
      待你后续添加
    </div>
  </div>

</div>
</body>
</html>
