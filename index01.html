<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱 - 详情页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#ffdd66;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
}
.page-container{
  display:flex;
  min-height:100vh;
}
.left-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-right:1px solid #444;
}
.center-panel{
  width:50%;
  padding:30px 20px;
  overflow-y:auto;
}
.right-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-left:1px solid #444;
}
.panel-title{
  font-size:20px;
  color:#ff8800;
  margin-bottom:20px;
  text-align:center;
}
.placeholder{
  color:#888;
  text-align:center;
  padding:40px 20px;
  border:1px dashed #444;
  border-radius:8px;
  min-height:200px;
}
.center-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#ffdd66;
}
.back-link{
  display:inline-block;
  color:#ff8800;
  text-decoration:none;
  margin-bottom:20px;
}

/* 手机自动改成上下排列 */
@media (max-width:768px){
  .page-container{flex-direction:column}
  .left-panel,.center-panel,.right-panel{width:100%}
  .left-panel,.right-panel{border:none;border-bottom:1px solid #444}
}
</style>
</head>
<body>
<div class="page-container">

  <!-- 左边 1/4：音乐区 -->
  <div class="left-panel">
    <h3 class="panel-title">🎵 音乐</h3>
    <div class="placeholder">
      这里放音乐<br>
      待你后续添加
    </div>
  </div>

  <!-- 中间 1/2：家谱主内容 -->
  <div class="center-panel">
    <a class="back-link" href="index.html">← 返回首页</a>
    <h2 class="center-title">世代族谱</h2>
    <div id="family-content">
      <div style="text-align:center;color:#aaa;padding:40px;">
        这里展示详细世代族谱<br>
        明天继续完善内容
      </div>
    </div>
  </div>

  <!-- 右边 1/4：祖先信息 -->
  <div class="right-panel">
    <h3 class="panel-title">先祖简介</h3>
    <div class="placeholder">
      这里放祖先资料<br>
      待你后续添加
    </div>
  </div>

</div>
</body>
</html>
