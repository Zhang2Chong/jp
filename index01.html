<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#ffdd66;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  margin:0;
}
.page-container{
  display:flex;
  min-height:100vh;
}
.left-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-right:1px solid #444;
}
.center-panel{
  width:50%;
  padding:0;
  overflow-y:auto;
}
.right-panel{
  width:25%;
  background:#222;
  padding:20px;
  border-left:1px solid #444;
}
.panel-title{
  font-size:20px;
  color:#ff8800;
  margin-bottom:20px;
  text-align:center;
}
.placeholder{
  color:#888;
  text-align:center;
  padding:40px 20px;
  border:1px dashed #444;
  border-radius:8px;
  min-height:200px;
}

/* === 中间内容容器：自动居中、限制最大宽度，不会拉太宽 === */
.content-wrap{
  max-width:700px;
  margin:0 auto;
  padding:20px 16px 40px;
  width:100%;
}
/* 顶部固定区域 */
.header-fixed{
  position:sticky;
  top:0;
  background:#1a1a1a;
  padding:20px 0 24px;
  z-index:10;
  border-bottom:1px solid #333;
  margin-bottom:20px;
}
h1{
  font-size:clamp(32px,8vw,44px);
  text-align:center;
  margin:0 0 12px;
  color:#ffdd66;
  letter-spacing:6px;
}
.stats-line{
  text-align:center;
  font-size:clamp(16px,4vw,20px);
  color:#e2b558;
  margin-bottom:16px;
}
.search-box{
  width:100%;
  padding:12px 16px;
  font-size:16px;
  background:#2a2a2a;
  color:#fff;
  border:1px solid #444;
  border-radius:6px;
}
/* 世代列表 */
.genTitle{
  color:#ff3333;
  font-size:22px;
  margin:24px 0 6px;
  display:flex;
  align-items:center;
  gap:10px;
}
.genTitle::before{
  content:"";
  width:4px;
  height:22px;
  background:#ff3333;
  display:block;
}
.divider-line{
  height:1px;
  background:#333;
  margin:4px 0 6px;
}
.personName{
  color:#ffdd66;
  font-size:18px;
  padding:6px 0 6px 14px;
  cursor:pointer;
}
.personName:hover{
  color:#fff;
}
.loading{
  text-align:center;
  color:#888;
  padding:60px 20px;
  font-size:16px;
}

/* 手机自动改成上下排列 */
@media (max-width:900px){
  .page-container{flex-direction:column}
  .left-panel,.center-panel,.right-panel{width:100%}
  .left-panel,.right-panel{border:none;border-bottom:1px solid #444;min-height:150px;}
}
</style>
</head>
<body>
<div class="page-container">

  <!-- 左边 1/4：音乐区 -->
  <div class="left-panel">
    <h3 class="panel-title">🎵 音乐</h3>
    <div class="placeholder">
      这里放音乐<br>
      待你后续添加
    </div>
  </div>

  <!-- 中间 1/2：世代族谱内容 -->
  <div class="center-panel">
    <div class="content-wrap">
      <div class="header-fixed">
        <h1>张氏家谱</h1>
        <div class="stats-line" id="stats">正在统计……</div>
        <input class="search-box" id="searchInput" placeholder="输入姓名、别名或编号">
      </div>
      <div id="content" class="loading">正在加载世代族谱……</div>
    </div>
  </div>

  <!-- 右边 1/4：祖先信息 -->
  <div class="right-panel">
    <h3 class="panel-title">先祖简介</h3>
    <div class="placeholder">
      这里放祖先资料<br>
      待你后续添加
    </div>
  </div>

</div>

<script>
const CSV_URL="https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let allData=[];

async function loadData(){
  const res=await fetch(CSV_URL);
  const text=await res.text();
  const lines=text.trim().split(/\r?\n/);
  const head=lines[0].split(",");
  const idxName=head.indexOf("姓名");
  const idxAlias=head.indexOf("别名")||head.indexOf("字");
  const idxNo=head.indexOf("No");
  const idxGen=head.indexOf("世代");

  allData=[];
  for(let i=1;i<lines.length;i++){
    const cell=lines[i].split(",");
    const name=cell[idxName]?.trim()||"";
    const alias=idxAlias>=0 ? (cell[idxAlias]?.trim()||"") : "";
    allData.push({
      name:name,
      alias:alias,
      no:cell[idxNo]?.trim()||"",
      gen:parseInt(cell[idxGen])||1
    })
  }

  const maxGen=Math.max(...allData.map(p=>p.gen));
  document.getElementById("stats").innerText=
    `${allData.length} 位家人 · ${maxGen} 代传承`;

  renderList();
}

function renderList(keyword=""){
  let list=allData;
  if(keyword){
    const kw=keyword.toLowerCase();
    list=allData.filter(p=>
      p.name.toLowerCase().includes(kw) ||
      (p.alias && p.alias.toLowerCase().includes(kw)) ||
      p.no===keyword
    );
  }

  const groups={};
  let maxGen=0;
  list.forEach(p=>{
    if(!groups[p.gen]) groups[p.gen]=[];
    groups[p.gen].push(p);
    if(p.gen>maxGen) maxGen=p.gen;
  })

  let html="";
  for(let g=1;g<=maxGen;g++){
    if(groups[g]){
      html+=`<div class="genTitle">第${g}代</div>`;
      html+=`<div class="divider-line"></div>`;
      groups[g].forEach(p=>{
        const display=p.alias ? `${p.name}（${p.alias}）` : p.name;
        html+=`<div class="personName" onclick="location.href='person.html?no=${p.no}'">${display}</div>`;
      })
    }
  }
  document.getElementById("content").innerHTML=html || 
    `<div style="text-align:center;color:#666;padding:40px;">没有找到匹配的族人</div>`;
}

document.getElementById("searchInput").addEventListener("input",e=>{
  renderList(e.target.value.trim());
})

loadData().catch(err=>{
  document.getElementById("content").innerText="读取数据失败："+err.message;
})
</script>

</body>
</html>
