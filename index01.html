<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两人血缘对比 - 电脑版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  padding:16px;
}
.wrapper{
  max-width:1400px;
  margin:0 auto;
  width:100%;
}
h1{
  text-align:center;
  font-size:24px;
  margin-bottom:20px;
  color:#ffcc44;
}
.main-layout{
  display:flex;
  gap:16px;
  align-items:flex-start;
}

/* ===== 左边栏 & 右边栏：各5个空位 ===== */
.side-column{
  width:200px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
}
.side-slot{
  background:#252525;
  border:1px dashed #555;
  border-radius:6px;
  padding:20px 10px;
  text-align:center;
  color:#777;
  font-size:14px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== 中间：iframe 区域 ===== */
.center-column{
  flex:1;
  min-width:0;
}
.iframe-container{
  border:1px solid #444;
  border-radius:6px;
  overflow:hidden;
  background:#000;
}
.center-column iframe{
  width:100%;
  height:800px;
  border:none;
  display:block;
}

/* ===== 手机上自动变回上下排列 ===== */
@media (max-width:900px){
  .main-layout{
    flex-direction:column;
  }
  .side-column{
    width:100%;
    flex-direction:row;
    flex-wrap:wrap;
  }
  .side-slot{
    flex:1 1 calc(20% - 8px);
    min-width:120px;
  }
}
</style>
</head>
<body>
<div class="wrapper">

  <h1>📜 两人血缘对比 · 扩展版</h1>

  <div class="main-layout">
    <!-- 左边：5个空位 -->
    <div class="side-column">
      <div class="side-slot">左侧位置 1</div>
      <div class="side-slot">左侧位置 2</div>
      <div class="side-slot">左侧位置 3</div>
      <div class="side-slot">左侧位置 4</div>
      <div class="side-slot">左侧位置 5</div>
    </div>

    <!-- 中间：iframe 嵌入对比页面 -->
    <div class="center-column">
      <div class="iframe-container">
        <iframe src="index.html" title="血缘对比"></iframe>
      </div>
    </div>

    <!-- 右边：5个空位 -->
    <div class="side-column">
      <div class="side-slot">右侧位置 1</div>
      <div class="side-slot">右侧位置 2</div>
      <div class="side-slot">右侧位置 3</div>
      <div class="side-slot">右侧位置 4</div>
      <div class="side-slot">右侧位置 5</div>
    </div>
  </div>

</div>
</body>
</html>
