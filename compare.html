<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两人血缘对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  padding:16px;
}
.wrapper{
  max-width:600px;
  margin:0 auto;
  width:100%;
}
.top-link{
  margin-bottom:20px;
}
.top-link a{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}
h1{
  text-align:center;
  font-size:24px;
  margin-bottom:20px;
  color:#ffcc44;
}
.row-container{
  display:flex;
  gap:24px;
  margin-bottom:20px;
}
.col{
  flex:1;
}
.search-row{
  display:flex;
  gap:6px;
  margin-bottom:8px;
}
.search-row input{
  flex:1;
  padding:10px;
  background:#2b2b2b;
  border:1px solid #555;
  color:#fff;
  border-radius:4px;
  font-size:15px;
}
.search-row button{
  padding:10px 12px;
  background:#ff9f29;
  border:none;
  border-radius:4px;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}
.result-list{
  background:#2b2b2b;
  border:1px solid #444;
  border-radius:4px;
  max-height:180px;
  overflow-y:auto;
}
.person-item{
  padding:8px 10px;
  border-bottom:1px solid #333;
  cursor:pointer;
  font-size:15px;
}
.person-item:hover{
  background:#3c3c3c;
}
.selected-name{
  padding:8px 10px;
  background:#2b2b2b;
  border:1px solid #ff9f29;
  border-radius:4px;
  min-height:40px;
  line-height:22px;
  font-size:15px;
  margin-bottom:4px;
}
.compare-btn{
  width:100%;
  padding:14px;
  background:#0088ff;
  border:none;
  border-radius:6px;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:20px;
}
.compare-btn:disabled{
  background:#335577;
  color:#888;
  cursor:not-allowed;
}
.result-area{
  background:#2b2b2b;
  border:1px solid #444;
  border-radius:6px;
  padding:16px;
  display:none;
}
.result-area.show{
  display:block;
}
.common-ancestor{
  text-align:center;
  font-size:18px;
  color:#ffcc44;
  padding:16px 12px;
  background:#382c00;
  border-radius:4px;
  margin-bottom:20px;
  line-height:2.2;
}
.common-name{
  font-size:27px;
  font-weight:bold;
  color:#fff;
  margin-left:8px;
}
.two-line{
  display:flex;
  gap:24px;
}
.line-col{
  flex:1;
}
.person-card{
  background:#222;
  border:1px solid #444;
  border-radius:4px;
  padding:8px 10px;
  margin-bottom:6px;
  text-align:center;
}
.person-card.gen{
  font-size:13px;
  color:#aaa;
  margin-bottom:4px;
}
.person-card.name-wrap{
  font-size:15px;
}
.person-card.name-wrap.large{
  font-size:23px;
  font-weight:bold;
  color:#fff;
}
.person-card.child{
  font-size:12px;
  color:#888;
  margin-left:4px;
}
</style>
</head>
<body>
<div class="wrapper">

  <div class="top-link">
    <a href="index.html">← 返回主页</a>
  </div>

  <h1>⚖️ 两人血缘对比</h1>

  <div class="row-container">
    <!-- 左边：A -->
    <div class="col">
      <div class="search-row">
        <input type="text" id="searchA" placeholder="输入名字或编号">
        <button onclick="searchPerson('A')">寻找</button>
      </div>
      <div class="result-list" id="listA" style="display:none;"></div>
      <div class="selected-name" id="selectedA">— 未选择 —</div>
    </div>

    <!-- 右边：B -->
    <div class="col">
      <div class="search-row">
        <input type="text" id="searchB" placeholder="输入名字或编号">
        <button onclick="searchPerson('B')">寻找</button>
      </div>
      <div class="result-list" id="listB" style="display:none;"></div>
      <div class="selected-name" id="selectedB">— 未选择 —</div>
    </div>
  </div>

  <button class="compare-btn" id="compareBtn" disabled onclick="doCompare()">开始对比，找共同祖先</button>

  <div class="result-area" id="resultArea">
    <div class="common-ancestor" id="commonResult"></div>
    <div class="two-line">
      <div class="line-col" id="lineA"></div>
      <div class="line-col" id="lineB"></div>
    </div>
  </div>

</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let allPeople = [];
let selectedA = null;
let selectedB = null;

async function loadCSV(){
  try{
    const res = await fetch(CSV_URL + "?t=" + Date.now());
    const text = await res.text();
    parseCSV(text);
  }catch(err){
    console.error("读取失败", err);
  }
}

function parseCSV(text){
  const lines = text.trim().split("\n");
  if(lines.length < 2) return;
  const sep = lines[0].indexOf(",") >= 0 ? "," : "\t";
  const header = lines[0].split(sep).map(h => h.trim());
  
  const idx = {
    name: header.indexOf('姓名'),
    no: header.indexOf('No'),
    fatherId: header.indexOf('父亲编号'),
    generation: header.indexOf('世代'),
    childOrder: header.indexOf('兄弟排名')
  };
  
  allPeople = [];
  for(let i=1; i<lines.length; i++){
    const col = lines[i].split(sep).map(c => c.trim());
    allPeople.push({
      name: idx.name >= 0 ? col[idx.name] : "",
      no: idx.no >= 0 ? col[idx.no] : "",
      fatherId: idx.fatherId >= 0 ? col[idx.fatherId] : "",
      generation: idx.generation >= 0 ? col[idx.generation] : "",
      childOrder: idx.childOrder >= 0 ? col[idx.childOrder] : ""
    });
  }
}

function withZhang(name){
  if(!name) return "";
  return name.startsWith("张") ? name : "张" + name;
}

function searchPerson(side){
  const input = document.getElementById("search" + side).value.trim();
  const list = document.getElementById("list" + side);
  
  if(!input){
    list.style.display = "none";
    return;
  }
  
  const matches = allPeople.filter(p => 
    (p.name && p.name.includes(input)) || (p.no === input)
  ).slice(0, 15);
  
  list.innerHTML = "";
  if(matches.length === 0){
    list.innerHTML = '<div class="person-item">未找到</div>';
  }else{
    matches.forEach(p => {
      const div = document.createElement("div");
      div.className = "person-item";
      div.textContent = `${withZhang(p.name)} · 第${p.generation}代`;
      div.onclick = () => selectPerson(side, p);
      list.appendChild(div);
    });
  }
  list.style.display = "block";
}

function selectPerson(side, person){
  document.getElementById("list" + side).style.display = "none";
  document.getElementById("search" + side).value = "";
  document.getElementById("selected" + side).textContent = 
    `${withZhang(person.name)} · 第${person.generation}代`;
  
  if(side === 'A') selectedA = person;
  else selectedB = person;
  
  updateCompareButton();
}

function updateCompareButton(){
  const btn = document.getElementById("compareBtn");
  btn.disabled = !(selectedA && selectedB);
}

function getAncestorChain(person){
  const chain = [];
  let current = person;
  const seen = new Set();
  
  while(current && current.no && !seen.has(current.no)){
    seen.add(current.no);
    chain.push(current);
    if(!current.fatherId || current.fatherId === "0" || current.fatherId === "") break;
    current = allPeople.find(p => p.no === current.fatherId);
  }
  return chain;
}

function findCommonAncestor(chainA, chainB){
  const setB = new Set(chainB.map(p => p.no));
  for(const a of chainA){
    if(setB.has(a.no)) return a;
  }
  return null;
}

function makeCard(person, isBottom){
  const orderText = person.childOrder && person.childOrder !== "0" ? `<span class="child">第${person.childOrder}子</span>` : "";
  return `
    <div class="person-card">
      <div class="gen">第${person.generation}代</div>
      <div class="name-wrap ${isBottom ? 'large' : ''}">${withZhang(person.name)}${orderText}</div>
    </div>
  `;
}

function doCompare(){
  const chainA = getAncestorChain(selectedA);
  const chainB = getAncestorChain(selectedB);
  const common = findCommonAncestor(chainA, chainB);
  
  const resultArea = document.getElementById("resultArea");
  const commonResult = document.getElementById("commonResult");
  const lineA = document.getElementById("lineA");
  const lineB = document.getElementById("lineB");
  
  resultArea.classList.add("show");
  
  if(!common){
    commonResult.innerHTML = "暂未找到共同祖先";
    lineA.innerHTML = chainA.map(p => makeCard(p, false)).join("");
    lineB.innerHTML = chainB.map(p => makeCard(p, false)).join("");
    return;
  }
  
  const idxA = chainA.findIndex(p => p.no === common.no);
  const idxB = chainB.findIndex(p => p.no === common.no);
  const shortA = chainA.slice(0, idxA).reverse();
  const shortB = chainB.slice(0, idxB).reverse();
  
  commonResult.innerHTML = `你们的共同祖先是： 第${common.generation}代<span class="common-name">${withZhang(common.name)}</span>`;
  
  lineA.innerHTML = shortA.map((p, i, arr) => makeCard(p, i === arr.length - 1)).join("");
  lineB.innerHTML = shortB.map((p, i, arr) => makeCard(p, i === arr.length - 1)).join("");
}

loadCSV();
</script>

</body>
</html>
