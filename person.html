<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族人详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#121212;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}
.top-nav{
  display:flex;
  justify-content:space-between;
  margin-bottom:24px;
}
.nav-link{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}

.name-card{
  background:#1e1e1e;
  border-radius:12px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:30px;
}
.person-name{
  font-size:36px;
  margin-bottom:10px;
}
.gen-badge{
  display:inline-block;
  background:#333;
  color:#ff9f29;
  padding:6px 22px;
  border-radius:20px;
  font-size:17px;
}

.section-title{
  text-align:center;
  font-size:20px;
  margin-bottom:16px;
  padding-bottom:8px;
  border-bottom:1px solid #333;
}

.line-grid{
  display:flex;
  flex-wrap:wrap;
  gap:16px 24px;
  margin-bottom:30px;
}
.line-item{
  background:#252525;
  border-radius:8px;
  padding:18px 12px;
  text-align:center;
  text-decoration:none;
  color:#facc54;
  flex:0 0 calc(25% - 18px);
}
.line-item .gen-num{
  font-size:14px;
  color:#999;
  margin-bottom:6px;
}
.line-item .name-text{
  font-size:18px;
}
.line-item:hover{
  background:#2d2d2d;
}

.info-row{
  background:#1e1e1e;
  border-radius:8px;
  padding:16px 20px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.label{
  color:#888;
  font-size:15px;
  margin-bottom:4px;
}
.value{
  font-size:17px;
}
.empty{
  color:#555;
  font-style:italic;
}

.two-side{
  display:flex;
  gap:20px;
  margin:24px 0;
}
.side-left{
  flex:1;
  background:#1e1e1e;
  border-radius:8px;
  padding:20px;
}
.side-right{
  width:180px;
  background:#1e1e1e;
  border-radius:8px;
  padding:12px;
  text-align:center;
}
.photo-show{
  max-width:100%;
  max-height:200px;
  border-radius:6px;
}

.note-area{
  background:#1e1e1e;
  border-radius:8px;
  padding:20px;
  margin-top:20px;
}
.note-label{
  color:#888;
  font-size:15px;
  margin-bottom:8px;
}
.note-text{
  font-size:16px;
  line-height:1.8;
}

@media (max-width:600px){
  .line-item{flex:0 0 calc(50% - 12px)}
  .two-side{flex-wrap:wrap}
  .side-left,.side-right{width:100%}
  .side-right{margin-top:16px}
}
</style>
</head>
<body>
<div class="top-nav">
  <a class="nav-link" href="index.html">← 返回首页</a>
  <a class="nav-link" href="javascript:history.back()">← 返回上一页</a>
</div>

<div id="content">
  <div style="text-align:center;color:#888;padding:80px 20px">正在加载……</div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let allPeople = {};

window.onload = async function(){
  const params = new URLSearchParams(window.location.search);
  let targetId = params.get("id");

  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const header = lines[0].split(",");
    
    const idxId = header.indexOf("编号");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");
    const idxFather = header.indexOf("父亲编号");
    const idxMother = header.indexOf("母亲") || header.indexOf("母亲编号");
    const idxSpouse = header.indexOf("配偶") || header.indexOf("妻子") || header.indexOf("丈夫");
    const idxPhoto = header.indexOf("相片") || header.indexOf("照片");
    const idxInfo = header.indexOf("备注") || header.indexOf("简介");

    for(let i=1;i<lines.length;i++){
      const col = lines[i].split(",");
      let id = (idxId>=0 && col[idxId]) ? col[idxId].trim() : "row_"+i;
      const name = col[idxName] ? col[idxName].trim() : "";
      const gen = col[idxGen] ? col[idxGen].trim() : "";
      const father = idxFather>=0 && col[idxFather] ? col[idxFather].trim() : "";
      const mother = idxMother>=0 && col[idxMother] ? col[idxMother].trim() : "";
      const spouse = idxSpouse>=0 && col[idxSpouse] ? col[idxSpouse].trim() : "";
      const photo = idxPhoto>=0 && col[idxPhoto] ? col[idxPhoto].trim() : "";
      const info = idxInfo>=0 && col[idxInfo] ? col[idxInfo].trim() : "";
      if(name){
        allPeople[id]={id,name,gen,father,mother,spouse,photo,info,children:[],lineNo:i};
      }
    }

    for(const pid in allPeople){
      const p=allPeople[pid];
      if(p.father && allPeople[p.father]){
        allPeople[p.father].children.push(pid);
      }
    }

    let person=null;
    if(targetId){
      person=allPeople[targetId];
      if(!person && targetId.startsWith("row_")){
        const rowNum=parseInt(targetId.replace("row_",""));
        for(const pid in allPeople){
          if(allPeople[pid].lineNo===rowNum){person=allPeople[pid];break;}
        }
      }
    }
    if(!person){
      document.getElementById("content").innerHTML="<div style='text-align:center;color:#666;padding:80px'>未找到该族人</div>";
      return;
    }

    function getLineageFromFirst(){
      let chain=[];
      let p=person;
      while(p){
        chain.unshift(p);
        if(p.father && allPeople[p.father]){
          p=allPeople[p.father];
        }else{
          p=null;
        }
      }
      return chain;
    }
    const lineage=getLineageFromFirst();

    function itemCard(p){
      return `<a class="line-item" href="person.html?id=${encodeURIComponent(p.id)}">
        <div class="gen-num">第${p.gen}代</div>
        <div class="name-text">${p.name}</div>
      </a>`;
    }

    let html=`
      <div class="name-card">
        <div class="person-name">${person.name}</div>
        <div class="gen-badge">第${person.gen}代</div>
      </div>

      <div class="section-title">世系源流</div>
      <div class="line-grid">
    `;
    for(const a of lineage){html+=itemCard(a);}
    html+=`</div>`;

    html+=`
      <div class="info-row">
        <div>
          <div class="label">父亲</div>
          <div class="value">${person.father&&allPeople[person.father]?'<a href="person.html?id='+encodeURIComponent(allPeople[person.father].id)+'" style="color:#facc544;text-decoration:none">'+allPeople[person.father].name+'</a>':'<span class="empty">—</span>'}</div>
        </div>
        <div>
          <div class="label">母亲</div>
          <div class="value">${person.mother||'<span class="empty">—</span>'}</div>
        </div>
      </div>

      <div class="info-row">
        <div>
          <div class="label">妻子</div>
          <div class="value">${person.spouse||'<span class="empty">—</span>'}</div>
        </div>
        <div></div>
      </div>

      <div class="info-row">
        <div>
          <div class="label">子女 (${person.children.length}人)</div>
          <div class="value" style="display:flex;gap:16px;flex-wrap:wrap">
            ${person.children.length>0?person.children.map(cid=>'<a href="person.html?id='+encodeURIComponent(cid)+'" style="color:#facc544;text-decoration:none">'+allPeople[cid].name+'</a>').join(""):'<span class="empty">—</span>'}
          </div>
        </div>
        <div></div>
      </div>

      <div class="two-side">
        <div class="side-left">
          <div class="label">父亲</div>
          <div class="value" style="margin-bottom:20px">${person.father&&allPeople[person.father]?'<a href="person.html?id='+encodeURIComponent(allPeople[person.father].id)+'" style="color:#facc544;text-decoration:none">'+allPeople[person.father].name+' · 第'+allPeople[person.father].gen+'代</a>':'<span class="empty">—</span>'}</div>
          <div class="label">母亲</div>
          <div class="value">${person.mother||'<span class="empty">—</span>'}</div>
        </div>
        <div class="side-right">
          ${person.photo?'<img class="photo-show" src="'+person.photo+'" alt="相片">':'<div style="color:#444;padding:50px 10px">暂无相片</div>'}
        </div>
      </div>
    `;

    if(person.info){
      html+=`
        <div class="note-area">
          <div class="note-label">备注</div>
          <div class="note-text">${person.info.replace(/\n/g,'<br>')}</div>
        </div>
      `;
    }

    document.getElementById("content").innerHTML=html;

  }catch(err){
    document.getElementById("content").innerHTML=`<div style="text-align:center;color:#f66;padding:80px">加载失败：${err.message}</div>`;
  }
};
</script>
</body>
</html>
