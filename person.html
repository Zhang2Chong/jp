<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单人详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  padding:16px;
}
.top-links{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.top-links a{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}

.name-card{
  background:#2b2b2b;
  border-radius:8px;
  padding:24px;
  text-align:center;
  margin-bottom:24px;
}
.name-card h1{
  font-size:32px;
  margin-bottom:8px;
}
.gen-badge{
  display:inline-block;
  background:#444;
  padding:4px 16px;
  border-radius:20px;
  font-size:16px;
}

h2{
  text-align:center;
  font-size:20px;
  margin-bottom:16px;
  color:#ff6b35;
}

.ancestor-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:10px;
  margin-bottom:24px;
}
.ancestor-item{
  background:#383838;
  border-radius:6px;
  padding:10px 8px;
  text-align:center;
}
.ancestor-gen{
  font-size:14px;
  color:#aaa;
  margin-bottom:4px;
}
.ancestor-name{
  font-size:16px;
  margin-bottom:2px;
}
.ancestor-pos{
  font-size:12px;
  color:#888;
}

.info-row{
  background:#2b2b2b;
  border-radius:6px;
  padding:12px 16px;
  margin-bottom:8px;
  display:flex;
}
.info-label{
  width:60px;
  color:#aaa;
}
.info-value{
  flex:1;
}

.photo-area{
  margin-top:16px;
  text-align:center;
  color:#666;
  border:1px dashed #444;
  border-radius:6px;
  padding:30px;
}

.add-btn{
  margin-top:16px;
  text-align:right;
}
.add-btn a{
  display:inline-block;
  background:#e64a19;
  color:#fff;
  text-decoration:none;
  padding:8px 20px;
  border-radius:6px;
}

@media (max-width:480px){
  .ancestor-grid{grid-template-columns:repeat(2, 1fr);}
}
</style>
</head>
<body>

<div class="top-links">
  <a href="index.html">← 返回首页</a>
  <a href="javascript:history.back()">← 返回上一页</a>
</div>

<div class="name-card">
  <h1 id="personName">—</h1>
  <div class="gen-badge" id="personGen">—</div>
</div>

<h2>世系源流</h2>

<div class="ancestor-grid" id="ancestorGrid">
</div>

<div class="info-row">
  <div class="info-label">父亲</div>
  <div class="info-value" id="fatherName">—</div>
</div>
<div class="info-row">
  <div class="info-label">母亲</div>
  <div class="info-value" id="motherName">—</div>
</div>
<div class="info-row">
  <div class="info-label">妻子</div>
  <div class="info-value" id="wifeName">—</div>
</div>

<div class="photo-area">暂无照片</div>

<div class="add-btn">
  <a href="admin.html">➕ 新增人员</a>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";

function withSurname(name){
  if(!name) return "";
  const n=name.trim();
  if(n.startsWith("张")) return n;
  return "张"+n;
}

const params = new URLSearchParams(location.search);
const targetId = params.get("id");

window.onload = async function(){
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const sep = lines[0].indexOf("\t") >= 0 ? "\t" : ",";
    const header = lines[0].split(sep);
    
    const idxNo = header.indexOf("No");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");
    const idxFather = header.indexOf("父亲编号");
    const idxBroRank = header.indexOf("兄弟排名");
    const idxMother = header.indexOf("母亲");
    const idxWife = header.indexOf("妻子");

    const people = {};
    for(let i=1;i<lines.length;i++){
      const col = lines[i].split(sep);
      const no = idxNo>=0 && col[idxNo] ? col[idxNo].trim() : "";
      if(!no) continue;
      people[no] = {
        name: idxName>=0 && col[idxName] ? col[idxName].trim() : "",
        gen: idxGen>=0 && col[idxGen] ? col[idxGen].trim() : "",
        father: idxFather>=0 && col[idxFather] ? col[idxFather].trim() : "",
        broRank: idxBroRank>=0 && col[idxBroRank] ? col[idxBroRank].trim() : "",
        mother: idxMother>=0 && col[idxMother] ? col[idxMother].trim() : "",
        wife: idxWife>=0 && col[idxWife] ? col[idxWife].trim() : ""
      };
    }

    const person = people[targetId];
    if(!person){
      document.querySelector(".name-card").innerHTML = "<h2>查无此人</h2>";
      return;
    }

    document.getElementById("personName").textContent = withSurname(person.name);
    document.getElementById("personGen").textContent = `第${person.gen}代 · 第${person.broRank}子`;
    document.getElementById("fatherName").textContent = person.father && person.father !== "0" && people[person.father] 
      ? withSurname(people[person.father].name) 
      : "—";
    document.getElementById("motherName").textContent = person.mother || "—";
    document.getElementById("wifeName").textContent = person.wife || "—";

    const ancestors = [];
    let currId = targetId;
    while(currId && people[currId]){
      const p = people[currId];
      ancestors.unshift({
        no: currId,
        name: p.name,
        gen: p.gen,
        broRank: p.broRank
      });
      currId = p.father;
    }

    let html = "";
    for(const a of ancestors){
      html += `<div class="ancestor-item">
        <div class="ancestor-gen">第${a.gen}代</div>
        <div class="ancestor-name">${withSurname(a.name)}</div>
        <div class="ancestor-pos">第${a.broRank}子</div>
      </div>`;
    }
    document.getElementById("ancestorGrid").innerHTML = html;

  }catch(err){
    console.error(err);
  }
};
</script>

</body>
</html>
