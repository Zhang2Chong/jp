<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张氏家谱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #f5d76e;
            min-height: 100vh;
            padding: 15px;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .nav-links a {
            color: #ff9f43;
            text-decoration: none;
            font-size: 16px;
        }

        .main-card, .generation-card {
            background-color: #2b2b2b;
            border-radius: 12px;
            padding: 25px 20px;
            margin-bottom: 20px;
        }

        .name-title {
            font-size: 28px;
            text-align: center;
            margin-bottom: 15px;
            color: #ffd369;
        }

        .generation-badge {
            text-align: center;
        }

        .generation-badge span {
            background-color: #444;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 15px;
            color: #ffd369;
        }

        .section-title {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            color: #ffd369;
        }

        .ancestor-item {
            background-color: #383838;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .gen-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .ancestor-name {
            font-size: 17px;  /* ✅ 你要的17px */
            color: #ffd369;
        }

        /* 桌面端微调 */
        @media (min-width: 768px) {
            body {
                max-width: 600px;
                margin: 0 auto;
                padding: 30px;
            }
            .ancestor-name {
                font-size: 18px;  /* 桌面端恢复18px */
            }
            .name-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <div class="nav-links">
        <a href="#">← 返回首页</a>
        <a href="#">← 返回上一页</a>
    </div>

    <!-- 主卡片 -->
    <div class="main-card">
        <h1 class="name-title">学容</h1>
        <div class="generation-badge">
            <span>第20代</span>
        </div>
    </div>

    <!-- 世系源流 -->
    <div class="generation-card">
        <h2 class="section-title">世系源流</h2>
        
        <div class="ancestor-item">
            <div class="gen-label">第1代</div>
            <div class="ancestor-name">益山（迅昌）</div>
        </div>

        <div class="ancestor-item">
            <div class="gen-label">第2代</div>
            <div class="ancestor-name">文新（法灵）</div>
        </div>

        <div class="ancestor-item">
            <div class="gen-label">第3代</div>
            <div class="ancestor-name">宗仁（法明）</div>
        </div>

        <div class="ancestor-item">
            <div class="gen-label">第4代</div>
            <div class="ancestor-name"><!-- 待补充 --></div>
        </div>
    </div>
</body>
</html>
