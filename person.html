<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族人详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#121212;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}
.top-nav{
  display:flex;
  justify-content:space-between;
  margin-bottom:24px;
}
.nav-link{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}

.main-card{
  background:#1e1e1e;
  border-radius:12px;
  padding:32px 20px;
  text-align:center;
  margin-bottom:24px;
}
.main-name{
  font-size:36px;
  margin-bottom:12px;
}
.main-gen{
  display:inline-block;
  background:#333;
  color:#ff9f29;
  padding:6px 24px;
  border-radius:20px;
  font-size:18px;
}

.section-title{
  text-align:center;
  font-size:22px;
  margin-bottom:16px;
  padding-bottom:8px;
  border-bottom:1px solid #333;
}

.grid-container{
  display:flex;
  flex-wrap:wrap;
  gap:16px 20px;
  margin-bottom:28px;
}
.grid-item{
  background:#252525;
  border-radius:8px;
  padding:16px 10px;
  text-align:center;
  text-decoration:none;
  color:#facc54;
  flex:0 0 calc(25% - 15px);
}
.grid-item .gen-label{
  font-size:14px;
  color:#999;
  margin-bottom:4px;
}
.grid-item .name{
  font-size:18px;
}
.grid-item:hover{
  background:#2d2d2d;
}

.info-row{
  background:#1e1e1e;
  border-radius:8px;
  padding:16px 20px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.info-label{
  color:#888;
  font-size:15px;
  margin-bottom:4px;
}
.info-value{
  font-size:17px;
}

.two-column{
  display:flex;
  gap:20px;
  margin:20px 0;
}
.col-left{
  flex:1;
  background:#1e1e1e;
  border-radius:8px;
  padding:20px;
}
.col-right{
  width:180px;
  background:#1e1e1e;
  border-radius:8px;
  padding:10px;
  text-align:center;
}
.photo-img{
  max-width:100%;
  max-height:200px;
  border-radius:6px;
}

.note-block{
  background:#1e1e1e;
  border-radius:8px;
  padding:20px;
  margin-top:20px;
}
.note-title{
  color:#888;
  font-size:15px;
  margin-bottom:8px;
}
.note-text{
  font-size:16px;
  line-height:1.8;
}

.empty{
  color:#666;
  font-style:italic;
}

@media (max-width:600px){
  .grid-item{flex:0 0 calc(50% - 10px)}
  .two-column{flex-wrap:wrap}
  .col-left,.col-right{width:100%}
  .col-right{margin-top:16px}
}
</style>
</head>
<body>
<div class="top-nav">
  <a class="nav-link" href="index.html">← 返回首页</a>
  <a class="nav-link" href="javascript:history.back()">← 返回上一页</a>
</div>

<div id="content">
  <div style="text-align:center;color:#888;padding:60px 20px">正在加载……</div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let allPeople = {};

window.onload = async function(){
  const params = new URLSearchParams(window.location.search);
  let targetId = params.get("id");

  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const header = lines[0].split(",");
    
    const idxId = header.indexOf("编号");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");
    const idxFather = header.indexOf("父亲编号");
    const idxMother = header.indexOf("母亲") || header.indexOf("母亲编号");
    const idxSpouse = header.indexOf("配偶") || header.indexOf("妻子") || header.indexOf("丈夫");
    const idxPhoto = header.indexOf("相片") || header.indexOf("照片");
    const idxInfo = header.indexOf("备注") || header.indexOf("简介");

    for(let i=1;i<lines.length;i++){
      const col = lines[i].split(",");
      let id = (idxId>=0 && col[idxId]) ? col[idxId].trim() : "row_"+i;
      const name = col[idxName] ? col[idxName].trim() : "";
      const gen = col[idxGen] ? col[idxGen].trim() : "";
      const father = idxFather>=0 && col[idxFather] ? col[idxFather].trim() : "";
      const mother = idxMother>=0 && col[idxMother] ? col[idxMother].trim() : "";
      const spouse = idxSpouse>=0 && col[idxSpouse] ? col[idxSpouse].trim() : "";
      const photo = idxPhoto>=0 && col[idxPhoto] ? col[idxPhoto].trim() : "";
      const info = idxInfo>=0 && col[idxInfo] ? col[idxInfo].trim() : "";
      if(name){
        allPeople[id]={id,name,gen,father,mother,spouse,photo,info,children:[],lineNo:i};
      }
    }

    for(const pid in allPeople){
      const p=allPeople[pid];
      if(p.father && allPeople[p.father]){
        allPeople[p.father].children.push(pid);
      }
    }

    let person=null;
    if(targetId){
      person=allPeople[targetId];
      if(!person && targetId.startsWith("row_")){
        const rowNum=parseInt(targetId.replace("row_",""));
        for(const pid in allPeople){
          if(allPeople[pid].lineNo===rowNum){person=allPeople[pid];break;}
        }
      }
    }
    if(!person){
      document.getElementById("content").innerHTML="<div style='text-align:center;color:#888;padding:60px'>未找到该族人</div>";
      return;
    }

    function findAncestorsUp(toGen,limit=8){
      let chain=[],pid=person.id;
      for(let g=parseInt(person.gen)-1;g>=toGen && g>0 && chain.length<limit;g--){
        if(allPeople[pid] && allPeople[pid].father){
          pid=allPeople[pid].father;
          if(allPeople[pid]) chain.unshift(allPeople[pid]);
        }else break;
      }
      return chain;
    }
    const ancestors=findAncestorsUp(1,10);

    function cardLink(p){
      return `<a class="grid-item" href="person.html?id=${encodeURIComponent(p.id)}"><div class="gen-label">第${p.gen}代</div><div class="name">${p.name}</div></a>`;
    }

    let html=`
      <div class="main-card">
        <div class="main-name">${person.name}</div>
        <div class="main-gen">第${person.gen}代</div>
      </div>

      <div class="section-title">世系源流</div>
      <div class="grid-container">
    `;
    for(const a of ancestors){html+=cardLink(a);}
    html+=cardLink(person);
    html+=`</div>`;

    html+=`
      <div class="info-row">
        <div>
          <div class="info-label">父亲</div>
          <div class="info-value">${person.father&&allPeople[person.father]?'<a href="person.html?id='+encodeURIComponent(allPeople[person.father].id)+'" style="color:#facc54;text-decoration:none">'+allPeople[person.father].name+'</a>':'<span class="empty">—</span>'}</div>
        </div>
        <div>
          <div class="info-label">母亲</div>
          <div class="info-value">${person.mother||'<span class="empty">—</span>'}</div>
        </div>
      </div>

      <div class="info-row">
        <div>
          <div class="info-label">妻子</div>
          <div class="info-value">${person.spouse||'<span class="empty">—</span>'}</div>
        </div>
        <div></div>
      </div>

      <div class="info-row">
        <div>
          <div class="info-label">子女 (${person.children.length}人)</div>
          <div class="info-value" style="display:flex;gap:12px;flex-wrap:wrap">
            ${person.children.length>0?person.children.map(cid=>'<a href="person.html?id='+encodeURIComponent(cid)+'" style="color:#facc54">'+allPeople[cid].name+'</a>').join(""):'<span class="empty">—</span>'}
          </div>
        </div>
        <div></div>
      </div>

      <div class="two-column">
        <div class="col-left">
          <div class="info-label">父亲</div>
          <div class="info-value" style="margin-bottom:16px">${person.father&&allPeople[person.father]?'<a href="person.html?id='+encodeURIComponent(allPeople[person.father].id)+'" style="color:#facc54;text-decoration:none">'+allPeople[person.father].name+' 第'+allPeople[person.father].gen+'代</a>':'<span class="empty">—</span>'}</div>
          <div class="info-label">母亲</div>
          <div class="info-value">${person.mother||'<span class="empty">—</span>'}</div>
        </div>
        <div class="col-right">
          ${person.photo?'<img class="photo-img" src="'+person.photo+'" alt="相片">':'<div style="color:#444;padding:40px 0">暂无相片</div>'}
        </div>
      </div>
    `;

    if(person.info){
      html+=`
        <div class="note-block">
          <div class="note-title">备注</div>
          <div class="note-text">${person.info.replace(/\n/g,'<br>')}</div>
        </div>
      `;
    }

    document.getElementById("content").innerHTML=html;

  }catch(err){
    document.getElementById("content").innerHTML=`<div style="text-align:center;color:#f66;padding:60px">加载失败：${err.message}</div>`;
  }
};
</script>
</body>
</html>
