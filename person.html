<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族人详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#ffdd66;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}
.container{
  max-width:650px;
  margin:0 auto;
}
.nav-links{
  display:flex;
  justify-content:space-between;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:10px;
}
.back-link{
  color:#ff9933;
  text-decoration:none;
  font-size:15px;
}
.back-link:hover{color:#ffcc66}

h2{
  text-align:center;
  font-size:26px;
  margin-bottom:8px;
}
.gen-center{text-align:center;margin-bottom:24px}
.gen-tag{
  background:#333;
  border-radius:20px;
  padding:6px 20px;
  font-size:16px;
  color:#ff9933;
  display:inline-block;
}

.info-block{
  background:#2a2a2a;
  border-radius:10px;
  padding:20px;
  margin-bottom:16px;
  border:1px solid #383838;
}
.info-label{
  color:#999;
  font-size:14px;
  margin-bottom:4px;
}
.info-value{
  font-size:16px;
  color:#ffdd66;
  line-height:1.6;
}
.empty{
  text-align:center;
  color:#888;
  padding:60px 20px;
  font-size:16px;
}
</style>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a class="back-link" href="browse.html">← 回世系浏览</a>
    <a class="back-link" href="index.html">← 回首页</a>
  </div>
  <div id="content" class="empty">正在加载……</div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";

window.onload = async function(){
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get("id");
  
  if(!targetId){
    document.getElementById("content").innerHTML = "缺少族人编号";
    return;
  }

  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const header = lines[0].split(",");
    const idxId = header.indexOf("编号");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");
    const idxFather = header.indexOf("父亲编号");
    const idxBirth = header.indexOf("出生");
    const idxInfo = header.indexOf("备注");

    let found = null;
    
    // 两种方式都找：先用编号列，找不到再用行号
    for(let i=1;i<lines.length;i++){
      const col = lines[i].split(",");
      
      let rowId = "";
      if(idxId >= 0 && col[idxId]) rowId = col[idxId].trim();
      
      const rowLineId = "row_" + i;
      
      if(rowId === targetId || rowLineId === targetId){
        found = {
          name: idxName >= 0 && col[idxName] ? col[idxName].trim() : "",
          gen: idxGen >= 0 && col[idxGen] ? col[idxGen].trim() : "",
          id: rowId || rowLineId,
          father: idxFather >= 0 && col[idxFather] ? col[idxFather].trim() : "",
          birth: idxBirth >= 0 && col[idxBirth] ? col[idxBirth].trim() : "",
          info: idxInfo >= 0 && col[idxInfo] ? col[idxInfo].trim() : ""
        };
        break;
      }
    }

    if(!found){
      document.getElementById("content").innerHTML = "未找到该族人资料";
      return;
    }

    let html = `
      <h2>${found.name}</h2>
      <div class="gen-center"><span class="gen-tag">第${found.gen}代</span></div>
    `;
    if(found.id && found.id.indexOf("row_") !== 0){
      html += `
      <div class="info-block">
        <div class="info-label">编号</div>
        <div class="info-value">${found.id}</div>
      </div>
      `;
    }
    if(found.father){
      html += `
      <div class="info-block">
        <div class="info-label">父亲编号</div>
        <div class="info-value">${found.father}</div>
      </div>
      `;
    }
    if(found.birth){
      html += `
      <div class="info-block">
        <div class="info-label">出生</div>
        <div class="info-value">${found.birth}</div>
      </div>
      `;
    }
    if(found.info){
      html += `
      <div class="info-block">
        <div class="info-label">备注</div>
        <div class="info-value">${found.info}</div>
      </div>
      `;
    }

    document.getElementById("content").className = "";
    document.getElementById("content").innerHTML = html;

  }catch(err){
    document.getElementById("content").innerHTML = "加载失败：" + err.message;
  }
};
</script>
</body>
</html>
