<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族人详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}
.top-nav{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.nav-link{
  color:#ff9f29;
  text-decoration:none;
  font-size:15px;
}

.name-card{
  background:#252525;
  border-radius:10px;
  padding:24px 16px;
  text-align:center;
  margin-bottom:24px;
}
.person-name{
  font-size:32px;
  margin-bottom:8px;
}
.gen-badge{
  display:inline-block;
  background:#333;
  color:#ff9f29;
  padding:4px 18px;
  border-radius:16px;
  font-size:16px;
}

.section-title{
  text-align:right;
  font-size:17px;
  color:#ff9f29;
  margin-bottom:12px;
}

.line-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px 12px;
  justify-content:center;
  margin-bottom:28px;
}
.line-item{
  background:#2d2d2d;
  border-radius:6px;
  padding:10px 8px;
  text-align:center;
  text-decoration:none;
  color:#facc54;
  width:calc(50% - 6px);
  max-width:160px;
}
.line-item .gen-num{
  font-size:13px;
  color:#999;
  margin-bottom:2px;
}
.line-item .name-text{
  font-size:16px;
}
.line-item:hover{
  background:#383838;
}

.two-column{
  display:flex;
  gap:16px;
  margin-bottom:20px;
}
.col-left{
  flex:1;
}
.col-right{
  width:140px;
  flex-shrink:0;
  background:#252525;
  border-radius:8px;
  padding:8px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:180px;
}
.photo-img{
  max-width:100%;
  max-height:160px;
  border-radius:4px;
}

.info-block{
  background:#252525;
  border-radius:6px;
  padding:12px 16px;
  margin-bottom:8px;
}
.info-label{
  font-size:14px;
  color:#888;
  margin-bottom:4px;
}
.info-value{
  font-size:16px;
}
.info-value a{
  color:#facc54;
  text-decoration:none;
}
.empty{
  color:#555;
  font-style:italic;
}

.note-block{
  background:#252525;
  border-radius:6px;
  padding:16px;
  margin-top:16px;
}
.note-label{
  font-size:14px;
  color:#888;
  margin-bottom:6px;
}
.note-text{
  font-size:15px;
  line-height:1.7;
}
</style>
</head>
<body>
<div class="top-nav">
  <a class="nav-link" href="index.html">← 返回首页</a>
  <a class="nav-link" href="javascript:history.back()">← 返回上一页</a>
</div>

<div id="content">
  <div style="text-align:center;color:#888;padding:60px 20px">正在加载……</div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let allPeople = {};

window.onload = async function(){
  const params = new URLSearchParams(window.location.search);
  let targetId = params.get("id");

  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const header = lines[0].split(",");
    
    const idxId = header.indexOf("编号");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");
    const idxFather = header.indexOf("父亲编号");
    const idxMother = header.indexOf("母亲") || header.indexOf("母亲编号");
    const idxSpouse = header.indexOf("配偶") || header.indexOf("妻子") || header.indexOf("丈夫");
    const idxPhoto = header.indexOf("相片") || header.indexOf("照片");
    const idxInfo = header.indexOf("备注") || header.indexOf("简介");

    for(let i=1;i<lines.length;i++){
      const col = lines[i].split(",");
      let id = (idxId>=0 && col[idxId]) ? col[idxId].trim() : "row_"+i;
      const name = col[idxName] ? col[idxName].trim() : "";
      const gen = col[idxGen] ? col[idxGen].trim() : "";
      const father = idxFather>=0 && col[idxFather] ? col[idxFather].trim() : "";
      const mother = idxMother>=0 && col[idxMother] ? col[idxMother].trim() : "";
      const spouse = idxSpouse>=0 && col[idxSpouse] ? col[idxSpouse].trim() : "";
      const photo = idxPhoto>=0 && col[idxPhoto] ? col[idxPhoto].trim() : "";
      const info = idxInfo>=0 && col[idxInfo] ? col[idxInfo].trim() : "";
      if(name){
        allPeople[id]={id,name,gen,father,mother,spouse,photo,info,children:[],lineNo:i};
      }
    }

    for(const pid in allPeople){
      const p=allPeople[pid];
      if(p.father && allPeople[p.father]){
        allPeople[p.father].children.push(pid);
      }
    }

    let person=null;
    if(targetId){
      person=allPeople[targetId];
      if(!person && targetId.startsWith("row_")){
        const rowNum=parseInt(targetId.replace("row_",""));
        for(const pid in allPeople){
          if(allPeople[pid].lineNo===rowNum){person=allPeople[pid];break;}
        }
      }
    }
    if(!person){
      document.getElementById("content").innerHTML="<div style='text-align:center;color:#666;padding:80px'>未找到该族人</div>";
      return;
    }

    function getLineage(){
      let chain=[];
      let p=person;
      while(p){
        chain.unshift(p);
        if(p.father && allPeople[p.father]){
          p=allPeople[p.father];
        }else{
          p=null;
        }
      }
      return chain;
    }
    const lineage=getLineage();

    function itemCard(p){
      return `<a class="line-item" href="person.html?id=${encodeURIComponent(p.id)}">
        <div class="gen-num">第${p.gen}代</div>
        <div class="name-text">${p.name}</div>
      </a>`;
    }

    function personLink(id,name){
      if(id && allPeople[id]){
        return `<a href="person.html?id=${encodeURIComponent(id)}">${name} · 第${allPeople[id].gen}代</a>`;
      }
      return `<span class="empty">—</span>`;
    }

    let html=`
      <div class="name-card">
        <div class="person-name">${person.name}</div>
        <div class="gen-badge">第${person.gen}代</div>
      </div>

      <div class="section-title">世系源流</div>
      <div class="line-grid">
    `;
    for(const a of lineage){html+=itemCard(a);}
    html+=`</div>`;

    html+=`<div class="two-column">
      <div class="col-left">
        <div class="info-block">
          <div class="info-label">父亲</div>
          <div class="info-value">${personLink(person.father,person.father?allPeople[person.father]?.name:'')}</div>
        </div>
        <div class="info-block">
          <div class="info-label">母亲</div>
          <div class="info-value">${person.mother||'<span class="empty">—</span>'}</div>
        </div>
        <div class="info-block">
          <div class="info-label">妻子</div>
          <div class="info-value">${person.spouse||'<span class="empty">—</span>'}</div>
        </div>
        <div class="info-block">
          <div class="info-label">子女 (${person.children.length}人)</div>
          <div class="info-value" style="display:flex;gap:10px;flex-wrap:wrap">
            ${person.children.length>0
              ?person.children.map(cid=>'<a href="person.html?id='+encodeURIComponent(cid)+'">'+allPeople[cid].name+'</a>').join("")
              :'<span class="empty">—</span>'}
          </div>
        </div>
      </div>
      <div class="col-right">
        ${person.photo
          ?`<img class="photo-img" src="${person.photo}" alt="${person.name}">`
          :`<div style="color:#444;font-size:14px">暂无相片</div>`}
      </div>
    </div>`;

    if(person.info){
      html+=`
        <div class="note-block">
          <div class="note-label">备注</div>
          <div class="note-text">${person.info.replace(/\n/g,'<br>')}</div>
        </div>
      `;
    }

    document.getElementById("content").innerHTML=html;

  }catch(err){
    document.getElementById("content").innerHTML=`<div style="text-align:center;color:#f66;padding:80px">加载失败：${err.message}</div>`;
  }
};
</script>
</body>
</html>
