<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族人详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}
.wrapper{
  max-width:600px;
  margin:0 auto;
}
.top-nav{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.nav-link{
  color:#ff9f29;
  text-decoration:none;
  font-size:15px;
}

.name-card{
  background:#252525;
  border-radius:10px;
  padding:24px 16px;
  text-align:center;
  margin-bottom:24px;
}
.person-name{
  font-size:32px;
  margin-bottom:8px;
}
.gen-badge{
  display:inline-block;
  background:#333;
  color:#ff9f29;
  padding:4px 18px;
  border-radius:16px;
  font-size:16px;
}

.section-title{
  text-align:center;
  font-size:17px;
  color:#ff9f29;
  margin-bottom:12px;
}

.line-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px 12px;
  justify-content:center;
  margin-bottom:28px;
}
.line-item{
  background:#2d2d2d;
  border-radius:6px;
  padding:10px 6px;
  text-align:center;
  text-decoration:none;
  color:#facc54;
  width:calc(25% - 10px);
  min-width:110px;
  max-width:140px;
}
.line-item .gen-num{
  font-size:13px;
  color:#999;
  margin-bottom:2px;
}
.line-item .name-text{
  font-size:16px;
}
.line-item .rank-text{
  font-size:12px;
  color:#777;
  margin-top:2px;
}
.line-item:hover{
  background:#383838;
}

.two-column{
  display:flex;
  gap:16px;
  margin-bottom:20px;
}
.col-left{
  flex:1;
}
.col-right{
  width:140px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.photo-box{
  background:#252525;
  border-radius:6px;
  padding:8px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100px;
  max-height:120px;
}
.photo-img{
  max-width:100%;
  max-height:100px;
  border-radius:4px;
  object-fit:contain;
}

.btn{
  display:block;
  width:100%;
  padding:10px 8px;
  font-size:15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}
.btn-add{
  background:#c0392b;
  color:#fff;
}
.btn-edit{
  background:#e67e22;
  color:#fff;
}

.info-block{
  background:#252525;
  border-radius:6px;
  padding:12px 16px;
  margin-bottom:8px;
}
.info-label{
  font-size:14px;
  color:#888;
  margin-bottom:4px;
}
.info-value{
  font-size:16px;
  line-height:1.5;
}
.info-value a{
  color:#facc54;
  text-decoration:none;
}
.info-value a .son-rank{
  color:#777;
  font-size:14px;
}
.empty{
  color:#555;
  font-style:italic;
}

.note-block{
  background:#252525;
  border-radius:6px;
  padding:16px;
  margin-top:16px;
}
.note-label{
  font-size:14px;
  color:#888;
  margin-bottom:6px;
}
.note-text{
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
}

@media (max-width:480px){
  .wrapper{max-width:100%}
  .line-item{width:calc(50% - 6px);max-width:160px}
  .col-right{width:120px}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-nav">
    <a class="nav-link" href="index.html">← 返回首页</a>
    <a class="nav-link" href="javascript:history.back()">← 返回上一页</a>
  </div>

  <div id="content">
    <div style="text-align:center;color:#888;padding:60px 20px">正在加载……</div>
  </div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let allPeople = {};

function withSurname(name){
  if(!name) return "";
  const n=name.trim();
  if(n.startsWith("张")) return n;
  return "张"+n;
}

window.onload = async function(){
  const params = new URLSearchParams(window.location.search);
  let targetId = params.get("id");
  
  if(targetId && targetId.startsWith("row_")){
    targetId = targetId.replace("row_","");
  }

  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const header = lines[0].split(",");
    
    const idxNo = header.indexOf("No");
    const idxName = header.indexOf("姓名");
    const idxFather = header.indexOf("父亲编号");
    const idxRank = header.indexOf("兄弟排名");
    const idxGen = header.indexOf("世代");
    const idxWife = header.indexOf("妻子");
    const idxPhoto = header.indexOf("相片链接");
    const idxNote = header.indexOf("备注");

    for(let i=2;i<lines.length;i++){
      const col = lines[i].split(",");
      const no = idxNo>=0 && col[idxNo] ? col[idxNo].trim() : "";
      const name = idxName>=0 && col[idxName] ? col[idxName].trim() : "";
      if(!no || !name) continue;
      const father = idxFather>=0 && col[idxFather] ? col[idxFather].trim() : "";
      const rank = idxRank>=0 && col[idxRank] ? col[idxRank].trim() : "";
      const gen = idxGen>=0 && col[idxGen] ? col[idxGen].trim() : "";
      const wife = idxWife>=0 && col[idxWife] ? col[idxWife].trim() : "";
      const photo = idxPhoto>=0 && col[idxPhoto] ? col[idxPhoto].trim() : "";
      const note = idxNote>=0 && col[idxNote] ? col[idxNote].trim() : "";
      
      allPeople[no]={
        no, name, father, rank, gen, wife, photo, note,
        children:[]
      };
    }

    for(const no in allPeople){
      const p=allPeople[no];
      if(p.father && p.father!=="0" && allPeople[p.father]){
        allPeople[p.father].children.push(no);
      }
    }

    let person=null;
    if(targetId && allPeople[targetId]){
      person=allPeople[targetId];
    }
    if(!person){
      document.getElementById("content").innerHTML="<div style='text-align:center;color:#666;padding:80px'>未找到该族人<br><small>ID:"+targetId+"</small></div>";
      return;
    }

    function getLineage(){
      let chain=[];
      let p=person;
      while(p){
        chain.unshift(p);
        if(p.father && p.father!=="0" && allPeople[p.father]){
          p=allPeople[p.father];
        }else{
          p=null;
        }
      }
      return chain;
    }
    const lineage=getLineage();

    function itemCard(p){
      let rankText="";
      if(p.rank && p.rank!=="" && p.father!=="0"){
        rankText=`<div class="rank-text">第${p.rank}子</div>`;
      }
      return `<a class="line-item" href="person.html?id=${encodeURIComponent(p.no)}">
        <div class="gen-num">第${p.gen}代</div>
        <div class="name-text">${withSurname(p.name)}</div>
        ${rankText}
      </a>`;
    }

    function personLink(no,name){
      if(no && allPeople[no]){
        return `<a href="person.html?id=${encodeURIComponent(no)}">${withSurname(allPeople[no].name)}</a>`;
      }
      return `<span class="empty">—</span>`;
    }

    let html=`
      <div class="name-card">
        <div class="person-name">${withSurname(person.name)}</div>
        <div class="gen-badge">第${person.gen}代${person.rank && person.father!=="0" ? ' · 第'+person.rank+'子' : ''}</div>
      </div>

      <div class="section-title">世系源流</div>
      <div class="line-grid">
    `;
    for(const a of lineage){html+=itemCard(a);}
    html+=`</div>`;

    html+=`<div class="two-column">
      <div class="col-left">
        <div class="info-block">
          <div class="info-label">父亲</div>
          <div class="info-value">
            ${person.father && person.father!=="0"
              ? personLink(person.father, allPeople[person.father]?.name)
              : '<span class="empty">—</span>'}
          </div>
        </div>
        <div class="info-block">
          <div class="info-label">母亲</div>
          <div class="info-value">
            ${person.father && person.father!=="0" && allPeople[person.father]?.wife
              ? allPeople[person.father].wife
              : '<span class="empty">—</span>'}
          </div>
        </div>
        <div class="info-block">
          <div class="info-label">妻子</div>
          <div class="info-value">${person.wife||'<span class="empty">—</span>'}</div>
        </div>
        <div class="info-block">
          <div class="info-label">儿子 (${person.children.length}人)</div>
          <div class="info-value" style="display:flex;gap:12px;flex-wrap:wrap">
            ${person.children.length>0
              ?person.children.map(cno=>{
                  const c=allPeople[cno];
                  const r=c.rank&&c.rank!==""?`<span class="son-rank">· 第${c.rank}子</span>`:"";
                  return `<a href="person.html?id=${encodeURIComponent(cno)}">${withSurname(c.name)}${r}</a>`;
                }).join("")
              :'<span class="empty">—</span>'}
          </div>
        </div>
      </div>
      <div class="col-right">
        <div class="photo-box">
          ${person.photo
            ?`<img class="photo-img" src="${person.photo}" alt="${withSurname(person.name)}">`
            :`<div style="color:#444;font-size:14px">暂无相片</div>`}
        </div>
        <a href="admin.html" class="btn btn-add">➕ 新增人员</a>
        <a href="admin.html?id=${encodeURIComponent(person.no)}" class="btn btn-edit">✏️ 修改资料</a>
      </div>
    </div>`;

    html+=`
      <div class="note-block">
        <div class="note-label">备注</div>
        <div class="note-text">${person.note||'<span class="empty">—</span>'}</div>
      </div>
    `;

    document.getElementById("content").innerHTML=html;

  }catch(err){
    document.getElementById("content").innerHTML=`<div style="text-align:center;color:#f66;padding:80px">加载失败：${err.message}</div>`;
  }
};
</script>
</body>
</html>
