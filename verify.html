<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认资料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#1a1a1a;
    color:#facc54;
    font-family:"Microsoft YaHei",sans-serif;
    min-height:100vh;
    padding:16px;
}

.center-box-wrapper{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px 0;
}

.password-card{
    background:#2b2b2b;
    border-radius:10px;
    width:100%;
    max-width:420px;
    padding:24px;
    text-align:center;
    display:flex;
    flex-direction:column;
}

.card-top-links{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
}
.card-top-links a{
    color:#ff9f29;
    text-decoration:none;
    font-size:15px;
}

.preview-section{
    background:#383838;
    border-radius:6px;
    padding:16px;
    margin-bottom:20px;
    text-align:left;
    display:none;
}
.preview-section.show{
    display:block;
}
.preview-title{
    text-align:center;
    font-size:15px;
    color:#ffcc44;
    margin-bottom:16px;
}
.preview-row{
    padding:6px 0;
    font-size:15px;
    line-height:1.8;
}
.preview-row.double{
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
}
.preview-label{
    color:#aaa;
}

h2{
    font-size:20px;
    margin-bottom:12px;
    margin-top:8px;
    color:#ffcc44;
}

.password-input{
    width:100%;
    padding:14px;
    font-size:24px;
    text-align:center;
    letter-spacing:8px;
    background:#383838;
    border:2px solid #555;
    border-radius:6px;
    color:#fff;
    margin-bottom:6px;
    outline:none;
}
.password-input:focus{
    border-color:#ff9f29;
}

.tip-msg{
    color:#888;
    font-size:14px;
    margin-bottom:4px;
    line-height:1.6;
}
.info-msg{
    color:#88ccff;
    font-size:14px;
    margin-bottom:4px;
    min-height:20px;
}
.info-msg.error{
    color:#ff6b6b;
}
.info-msg.success{
    color:#4ade80;
}
.countdown-msg{
    font-size:16px;
    margin:8px 0;
    min-height:24px;
    color:#ffdd77;
}
.countdown-msg.warn{
    color:#ff4444;
}

.btn-row{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:8px;
}
.btn{
    padding:12px 24px;
    border-radius:6px;
    font-size:16px;
    border:none;
    cursor:pointer;
    text-decoration:none;
}
.btn-cancel{
    background:#444;
    color:#ddd;
}
.btn-confirm{
    background:#e64a19;
    color:#fff;
}
.btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="center-box-wrapper">
    <div class="password-card">
        <div class="card-top-links">
            <a href="index.html">← 返回主页</a>
            <a href="javascript:goBack();">← 返回上一页</a>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-title" id="previewTitle">📋 请核对以下资料</div>

            <div class="preview-row">
                <span class="preview-label">华文名字：</span>
                <span id="pName">—</span>
            </div>
            <div class="preview-row double">
                <div><span class="preview-label">世代：</span><span id="pGen">—</span></div>
                <div><span class="preview-label">兄弟排名：</span><span id="pRank">—</span></div>
            </div>
            <div class="preview-row">
                <span class="preview-label">妻子：</span>
                <span id="pWife">无</span>
            </div>
            <div class="preview-row">
                <span class="preview-label">现居地：</span>
                <span id="pResidence">无</span>
            </div>
            <div class="preview-row">
                <span class="preview-label">安葬地：</span>
                <span id="pBurial">无</span>
            </div>
            <div class="preview-row double">
                <div><span class="preview-label">出生年份：</span><span id="pBirthYear">无</span></div>
                <div><span class="preview-label">逝世年份：</span><span id="pDeathYear">无</span></div>
            </div>
            <div class="preview-row">
                <span class="preview-label">相片：</span>
                <span id="pPhoto">无</span>
            </div>
            <div class="preview-row">
                <span class="preview-label">备注：</span>
                <span id="pNote">无</span>
            </div>
            <div class="preview-row" id="newIdNote" style="color:#4ade80; font-size:14px; margin-top:8px; display:none;">
                ℹ️ 新编号将自动分配，无需手动填写
            </div>
        </div>

        <h2 id="titleText">确认无误，请输入管理密码</h2>
        <input type="password" class="password-input" id="passwordInput" maxlength="6" placeholder="6位数字">
        <div class="tip-msg" id="tipMsg"></div>
        <div class="countdown-msg" id="countdownMsg"></div>
        <div class="info-msg" id="infoMsg"></div>
        <div class="btn-row">
            <button class="btn btn-cancel" onclick="goBack();">取消</button>
            <button class="btn btn-confirm" id="confirmBtn" onclick="submitToJq();">确认并提交</button>
        </div>
    </div>
</div>

<script>
const GITHUB_USER = "Zhang2Chong";
const JQ_REPO = "jq";
const JP_RAW_LOG_URL = "https://zhang2chong.github.io/jp/log.csv";
const CSV_RAW_URL = "https://zhang2chong.github.io/jp/token_seq.csv";

let knockToken = "";
let countdownTimer = null;
let pollTimer = null;
let isDone = false;
let redirecting = false;

const params = new URLSearchParams(window.location.search);
const type = params.get("type");
const id = params.get("id")?.replace(/#.*/, "") || "";
const fatherId = params.get("fatherId")?.replace(/#.*/, "") || "";

const formData = {
    name: params.get("name") || "",
    rank: params.get("rank") || "",
    generation: params.get("gen") || "",
    wife: params.get("wife") || "",
    residence: params.get("residence") || "",
    birthYear: params.get("birthYear") || "",
    burialPlace: params.get("burialPlace") || "",
    deathYear: params.get("deathYear") || "",
    photoLink: params.get("photoLinks") || "",
    note: params.get("note") || ""
};

function goBack(){
    if(type === "3"){
        window.location.href = "add.html?fatherId=" + encodeURIComponent(fatherId);
    }else if(type === "4"){
        window.location.href = "modify.html?id=" + encodeURIComponent(id);
    }else{
        history.back();
    }
}

function fillPreview(){
    if(type === "3" || type === "4"){
        document.getElementById("previewSection").classList.add("show");
        document.getElementById("previewTitle").textContent =
            type === "3" ? "📋 请核对新增资料" : "📋 请核对修改资料";

        document.getElementById("pName").textContent = formData.name ? "张" + formData.name : "—";
        document.getElementById("pGen").textContent = formData.generation ? "第" + formData.generation + "代" : "—";
        document.getElementById("pRank").textContent = formData.rank || "—";
        document.getElementById("pWife").textContent = formData.wife || "无";
        document.getElementById("pResidence").textContent = formData.residence || "无";
        document.getElementById("pBurial").textContent = formData.burialPlace || "无";
        document.getElementById("pBirthYear").textContent = formData.birthYear || "无";
        document.getElementById("pDeathYear").textContent = formData.deathYear || "无";

        if(formData.photoLink && formData.photoLink.trim()){
            const photos = formData.photoLink.split(/，,/).filter(p=>p.trim());
            document.getElementById("pPhoto").textContent = photos.length + " 张相片";
        }else{
            document.getElementById("pPhoto").textContent = "无";
        }

        document.getElementById("pNote").textContent = formData.note || "无";

        if(type === "3"){
            document.getElementById("newIdNote").style.display = "block";
        }else{
            document.getElementById("newIdNote").style.display = "none";
        }
    }else{
        document.getElementById("previewSection").classList.remove("show");
        document.getElementById("titleText").textContent = "无效入口，请从正确页面进入";
        document.getElementById("passwordInput").style.display = "none";
        document.getElementById("confirmBtn").style.display = "none";
    }
}

async function loadTokenFromCsv(){
    const infoMsg = document.getElementById("infoMsg");
    try{
        const res = await fetch(CSV_RAW_URL);
        if(!res.ok){
            infoMsg.textContent = "⚠️ 读取 token_seq.csv 失败，敲门令牌无法加载";
            return;
        }
        const text = await res.text();
        const lines = text.split("\n").filter(line=>line.trim()!="");
        if(lines.length < 2) {
            infoMsg.textContent = "⚠️ token_seq.csv 缺少第二行token数据";
            return;
        }
        const row = lines[1].split(",");
        const seg1 = row[0]?.trim() || "";
        const seg2 = row[1]?.trim() || "";
        const seg3 = row[2]?.trim() || "";
        knockToken = seg1 + seg2 + seg3;
        if(!knockToken){
            infoMsg.textContent = "⚠️ token三段为空，拼不出敲门token";
        }
    }catch(e){
        infoMsg.textContent = "⚠️ 读取 token_seq.csv 出错：" + e.message;
    }
}

function makeShortTicket(){
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let s = "";
    for(let i=0;i<8;i++){
        s += chars[Math.floor(Math.random() * chars.length)];
    }
    return s;
}

async function getLogLineCount(){
    try{
        const r = await fetch(JP_RAW_LOG_URL, {cache: "no-cache"});
        if(!r.ok) return 0;
        const t = await r.text();
        const arr = t.split("\n").filter(x=>x.trim()!="");
        return arr.length;
    }catch{
        return 0;
    }
}

async function checkNewLines(baseCount, targetTicket){
    try{
        const r = await fetch(JP_RAW_LOG_URL, {cache: "no-cache"});
        if(!r.ok) return null;
        const t = await r.text();
        const allLines = t.split("\n").filter(x=>x.trim()!="");
        if(allLines.length <= baseCount) return null;
        const newLines = allLines.slice(baseCount);
        for(const line of newLines){
            const cols = line.split(",");
            if(cols.length >=6 && cols[4].trim() === targetTicket){
                return cols;
            }
        }
        return null;
    }catch{
        return null;
    }
}

function clearAllTimers(){
    if(countdownTimer){
        clearInterval(countdownTimer);
        countdownTimer = null;
    }
    if(pollTimer){
        clearInterval(pollTimer);
        pollTimer = null;
    }
}

function goBrowse(){
    if(redirecting) return;
    redirecting = true;
    clearAllTimers();
    window.location.href = "browse.html";
}

async function submitToJq(){
    const password = document.getElementById("passwordInput").value.trim();
    const infoMsg = document.getElementById("infoMsg");
    const confirmBtn = document.getElementById("confirmBtn");
    const countdownMsg = document.getElementById("countdownMsg");

    infoMsg.className = "info-msg";
    infoMsg.textContent = "";
    countdownMsg.textContent = "";
    countdownMsg.classList.remove("warn");
    isDone = false;
    redirecting = false;

    if(!password || password.length !== 6){
        infoMsg.textContent = "❌ 请输入6位数字密码";
        infoMsg.classList.add("error");
        return;
    }
    if(!knockToken){
        infoMsg.textContent = "❌ 敲门令牌尚未加载，不能提交";
        infoMsg.classList.add("error");
        return;
    }

    confirmBtn.disabled = true;
    infoMsg.textContent = "⏳ 正在提交资料到校验通道...";
    infoMsg.className = "info-msg";

    let sendId = null;
    if(type === "4"){
        sendId = id;
    }

    const ticket = makeShortTicket();
    const baseLineCount = await getLogLineCount();

    const startedAt = Date.now();
    const totalLimitMs = 90000;
    const pollIntervalMs = 1000;

    const payload = {
        event_type: "family_submit",
        client_payload: {
            gate_password: password,
            op_type: type === "3" ? "add-person" : "modify-person",
            ticket: ticket,
            data: {
                no: sendId,
                fatherId: fatherId || null,
                name: formData.name,
                rank: formData.rank,
                generation: formData.generation,
                wife: formData.wife,
                residence: formData.residence,
                birthYear: formData.birthYear,
                burialPlace: formData.burialPlace,
                deathYear: formData.deathYear,
                photoLink: formData.photoLink,
                note: formData.note
            }
        }
    };

    try{
        const resp = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${JQ_REPO}/dispatches`,{
            method:"POST",
            headers:{
                "Accept":"application/vnd.github.v3+json",
                "Content-Type":"application/json",
                "Authorization": "token " + knockToken
            },
            body: JSON.stringify(payload)
        });

        if(resp.ok){
            infoMsg.textContent = `📤 已送出，工单：${ticket}，正在自动核对..`;
            infoMsg.className = "info-msg";

            countdownTimer = setInterval(()=>{
                const elapsed = Date.now() - startedAt;
                const remain = Math.max(0, Math.ceil((totalLimitMs - elapsed) / 1000));
                countdownMsg.textContent = `⌛ 剩余：${remain} 秒`;
                if(remain <= 30){
                    countdownMsg.classList.add("warn");
                }else{
                    countdownMsg.classList.remove("warn");
                }
                if(remain <= 0){
                    isDone = true;
                    goBrowse();
                }
            }, 1000);

            pollTimer = setInterval(async ()=>{
                if(isDone) return;
                const elapsed = Date.now() - startedAt;
                if(elapsed >= totalLimitMs){
                    isDone = true;
                    goBrowse();
                    return;
                }
                const cols = await checkNewLines(baseLineCount, ticket);
                if(cols !== null && !isDone){
                    const flag = cols[5].trim().toLowerCase();
                    if(flag === "t"){
                        isDone = true;
                        clearAllTimers();
                        infoMsg.textContent = "✅ 通过，家谱资料已经入库同步";
                        infoMsg.classList.add("success");
                        setTimeout(()=>{
                            window.location.href = "browse.html";
                        }, 3000);
                    }else{
                        infoMsg.textContent = "❌ 校对失败，请重新核对密码再提交";
                        infoMsg.classList.add("error");
                        confirmBtn.disabled = false;
                    }
                }
            }, pollIntervalMs);
        }else{
            const r = await resp.json();
            infoMsg.textContent = `❌ 提交失败：${r.message || "仓库触发异常"}`;
            infoMsg.classList.add("error");
            confirmBtn.disabled = false;
        }
    }catch(err){
        infoMsg.textContent = "❌ 网络错误，无法送出";
        infoMsg.classList.add("error");
        confirmBtn.disabled = false;
    }
}

document.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        submitToJq();
    }
});

fillPreview();
loadTokenFromCsv();
document.getElementById("passwordInput").focus();
</script>

</body>
</html>
