<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认资料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}

.center-box-wrapper{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px 0;
}

.password-card{
  background:#2b2b2b;
  border-radius:10px;
  width:100%;
  max-width:420px;
  padding:24px;
  text-align:center;
  display:flex;
  flex-direction:column;
}

.card-top-links{
  display:flex;
  justify-content:space-between;
  margin-bottom:16px;
}
.card-top-links a{
  color:#ff9f29;
  text-decoration:none;
  font-size:15px;
}

.preview-section{
  background:#383838;
  border-radius:6px;
  padding:16px;
  margin-bottom:20px;
  text-align:left;
  display:none;
}
.preview-section.show{
  display:block;
}
.preview-title{
  text-align:center;
  font-size:15px;
  color:#ffcc44;
  margin-bottom:16px;
}
.preview-row{
  padding:6px 0;
  font-size:15px;
  line-height:1.8;
}
.preview-row.triple{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.preview-row.triple > div{
  white-space:nowrap;
}
.preview-row.double{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.preview-label{
  color:#aaa;
}

h2{
  font-size:20px;
  margin-bottom:16px;
  margin-top:8px;
  color:#ffcc44;
}

.password-input{
  width:100%;
  padding:14px;
  font-size:24px;
  text-align:center;
  letter-spacing:8px;
  background:#383838;
  border:2px solid #555;
  border-radius:6px;
  color:#fff;
  margin-bottom:16px;
  outline:none;
}
.password-input:focus{
  border-color:#ff9f29;
}

.tip-msg{
  color:#888;
  font-size:14px;
  margin-bottom:12px;
  line-height:1.6;
}
.error-msg{
  color:#ff6b6b;
  font-size:15px;
  margin-bottom:12px;
  min-height:24px;
}
.success-msg{
  color:#4ade80;
  font-size:15px;
  margin-bottom:12px;
  min-height:24px;
}

.btn-row{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:8px;
}
.btn{
  padding:12px 24px;
  border-radius:6px;
  font-size:16px;
  border:none;
  cursor:pointer;
  text-decoration:none;
}
.btn-cancel{
  background:#444;
  color:#ddd;
}
.btn-confirm{
  background:#e64a19;
  color:#fff;
}
.btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}
</style>
</head>
<body>

<div class="center-box-wrapper">
  <div class="password-card">
    <div class="card-top-links">
      <a href="index.html">← 返回主页</a>
      <a href="javascript:goBack()">← 返回上一页</a>
    </div>

    <div class="preview-section" id="previewSection">
      <div class="preview-title" id="previewTitle">📋 请核对以下资料</div>
      
      <div class="preview-row">
        <span class="preview-label">华文名字：</span>
        <span id="pName">—</span>
      </div>
      <div class="preview-row triple">
        <div><span class="preview-label">世代：</span><span id="pGen">—</span></div>
        <div><span class="preview-label">兄弟排名：</span><span id="pRank">—</span></div>
        <div><span class="preview-label">儿子数量：</span><span id="pSon">—</span></div>
      </div>
      <div class="preview-row">
        <span class="preview-label">妻子：</span>
        <span id="pWife">无</span>
      </div>
      <div class="preview-row">
        <span class="preview-label">相片：</span>
        <span id="pPhoto">无</span>
      </div>
      <div class="preview-row">
        <span class="preview-label">备注：</span>
        <span id="pNote">无</span>
      </div>
      <div class="preview-row double">
        <div><span class="preview-label">现居地：</span><span id="pResidence">无</span></div>
        <div><span class="preview-label">出生年份：</span><span id="pBirthYear">无</span></div>
      </div>
      <div class="preview-row double">
        <div><span class="preview-label">安葬地：</span><span id="pBurial">无</span></div>
        <div><span class="preview-label">逝世年份：</span><span id="pDeathYear">无</span></div>
      </div>
      <div class="preview-row" id="newIdNote" style="color:#4ade80; font-size:14px; margin-top:8px; display:none;">
        ℹ️ 新编号将自动分配，无需手动填写
      </div>
    </div>

    <h2 id="titleText">请输入密码</h2>
    <input type="password" class="password-input" id="passwordInput" maxlength="6" placeholder="6位数字">
    <div class="tip-msg" id="tipMsg"></div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="goBack()">取消</button>
      <button class="btn btn-confirm" id="confirmBtn" onclick="checkPassword()">确认</button>
    </div>
  </div>
</div>

<script>
const ACCESS_PASSWORD = "771395";
const GITHUB_USER = "Zhang2Chong";
const GITHUB_REPO = "ZhangFamily";

const params = new URLSearchParams(window.location.search);
const type = params.get("type");
const id = params.get("id")?.replace(/#.*$/, "") || "";
const fatherId = params.get("fatherId")?.replace(/#.*$/, "") || "";

const formData = {
  name: params.get("name") || "",
  rank: params.get("rank") || "",
  generation: params.get("gen") || "",
  wife: params.get("wife") || "",
  sonCount: params.get("sonCount") || "",
  residence: params.get("residence") || "",
  birthYear: params.get("birthYear") || "",
  burial: params.get("burial") || "",
  deathYear: params.get("deathYear") || "",
  photoLink: params.get("photo") || "",
  note: params.get("note") || "",
  ziBei: params.get("ziBei") || ""
};

function goBack(){
  if(type === "1"){
    if(fatherId){
      window.location.href = "person.html?id=" + encodeURIComponent(fatherId);
    }else{
      history.back();
    }
  }else if(type === "2"){
    if(id){
      window.location.href = "person.html?id=" + encodeURIComponent(id);
    }else{
      history.back();
    }
  }else if(type === "3"){
    window.location.href = "add.html?fatherId=" + encodeURIComponent(fatherId);
  }else if(type === "4"){
    window.location.href = "modify.html?id=" + encodeURIComponent(id);
  }else{
    history.back();
  }
}

function fillPreview(){
  if(type === "3" || type === "4"){
    document.getElementById("previewSection").classList.add("show");
    document.getElementById("previewTitle").textContent = 
      type === "3" ? "📋 请核对新增资料" : "📋 请核对修改资料";
    document.getElementById("titleText").textContent = "确认无误，请输入密码提交";
    
    document.getElementById("pName").textContent = formData.name ? "张" + formData.name : "—";
    document.getElementById("pGen").textContent = formData.generation ? "第" + formData.generation + "代" : "—";
    document.getElementById("pRank").textContent = formData.rank || "—";
    document.getElementById("pSon").textContent = formData.sonCount || "0";
    document.getElementById("pWife").textContent = formData.wife || "无";
    document.getElementById("pResidence").textContent = formData.residence || "无";
    document.getElementById("pBirthYear").textContent = formData.birthYear || "无";
    document.getElementById("pBurial").textContent = formData.burial || "无";
    document.getElementById("pDeathYear").textContent = formData.deathYear || "无";
    
    if(formData.photoLink && formData.photoLink.trim()){
      const photos = formData.photoLink.split(/[,，]/).filter(p=>p.trim());
      document.getElementById("pPhoto").textContent = photos.length + " 张相片";
    }else{
      document.getElementById("pPhoto").textContent = "无";
    }
    
    document.getElementById("pNote").textContent = formData.note || "无";
    
    if(type === "3"){
      document.getElementById("newIdNote").style.display = "block";
    }else{
      document.getElementById("newIdNote").style.display = "none";
    }
  }else{
    document.getElementById("previewSection").classList.remove("show");
    document.getElementById("titleText").textContent = "请输入密码";
  }
}

function sendToGitHub(){
  const actionText = type === "3" ? "ADD" : "MODIFY";
  const displayName = formData.name ? "张" + formData.name : "—";
  
  const payload = {
    pwd: ACCESS_PASSWORD,
    type: type,
    chineseName: formData.name,
    no: type === "3" ? "" : id,
    father: fatherId,
    rank: formData.rank,
    generation: formData.generation,
    ziBei: formData.ziBei,
    wife: formData.wife,
    sonCount: formData.sonCount,
    photoLink: formData.photoLink,
    note: formData.note,
    residence: formData.residence,
    burial: formData.burial,
    birthYear: formData.birthYear,
    deathYear: formData.deathYear
  };

  const title = `${actionText}: ${displayName} (No.${type === "3" ? "auto" : id})`;
  const body = JSON.stringify(payload, null, 2);
  
  document.getElementById("tipMsg").textContent = "💡 正在提交，请稍候...";
  document.getElementById("successMsg").textContent = "✅ 提交成功！正在处理...";
  document.getElementById("passwordInput").disabled = true;
  document.getElementById("confirmBtn").disabled = true;

  // 静默在后台创建 Issue，不跳页面、不显示给用户
  const issueUrl = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  
  // 用一个隐藏的 iframe 来加载 Issue 页面，用户看不到
  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = issueUrl;
  document.body.appendChild(iframe);
  
  // 3秒后自动返回，用户不用做任何操作
  setTimeout(() => {
    if(type === "3"){
      window.location.href = "person.html?id=" + encodeURIComponent(fatherId);
    }else if(type === "4"){
      window.location.href = "person.html?id=" + encodeURIComponent(id);
    }else{
      history.back();
    }
  }, 3000);
}

function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  const tipMsg = document.getElementById("tipMsg");
  
  errorMsg.textContent = "";
  successMsg.textContent = "";
  tipMsg.textContent = "";
  
  if(input === ACCESS_PASSWORD){
    if(type === "1"){
      window.location.href = "add.html?fatherId=" + encodeURIComponent(id);
    }else if(type === "2"){
      window.location.href = "modify.html?id=" + encodeURIComponent(id);
    }else if(type === "3" || type === "4"){
      successMsg.textContent = "✅ 验证通过！正在提交...";
      document.getElementById("passwordInput").disabled = true;
      document.getElementById("confirmBtn").disabled = true;
      sendToGitHub();
    }else{
      errorMsg.textContent = "❌ 无效的操作类型";
    }
  }else{
    errorMsg.textContent = "❌ 密码错误，请重试";
    document.getElementById("passwordInput").value = "";
    document.getElementById("passwordInput").focus();
  }
}

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    checkPassword();
  }
});

fillPreview();
document.getElementById("passwordInput").focus();
</script>

</body>
</html>
