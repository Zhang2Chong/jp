<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加子孙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:16px;
}

.center-box-wrapper{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px 0;
}

.form-card{
  background:#2b2b2b;
  border-radius:10px;
  width:100%;
  max-width:420px;
  padding:24px;
}

.card-top-links{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.card-top-links a{
  color:#ff9f29;
  text-decoration:none;
  font-size:15px;
}

h1{
  text-align:center;
  font-size:22px;
  margin-bottom:24px;
  color:#ffcc44;
}

.info-box{
  background:#383838;
  border-radius:6px;
  padding:12px 16px;
  margin-bottom:20px;
  font-size:15px;
  line-height:1.8;
}
.info-box .label{
  color:#aaa;
}

.form-row{
  margin-bottom:16px;
}
.form-label{
  display:block;
  font-size:15px;
  color:#ddd;
  margin-bottom:6px;
}
.form-input{
  width:100%;
  padding:12px 14px;
  background:#383838;
  border:1px solid #555;
  border-radius:6px;
  color:#fff;
  font-size:16px;
  outline:none;
}
.form-input:focus{
  border-color:#ff9f29;
}
.form-input.readonly{
  background:#2a2a2a;
  color:#888;
}

.tip-text{
  font-size:13px;
  color:#777;
  margin-top:-10px;
  margin-bottom:12px;
}

.btn-row{
  display:flex;
  gap:12px;
  margin-top:24px;
}
.btn{
  flex:1;
  padding:14px;
  border-radius:6px;
  font-size:16px;
  border:none;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
}
.btn-cancel{
  background:#444;
  color:#ddd;
}
.btn-submit{
  background:#e64a19;
  color:#fff;
}
</style>
</head>
<body>

<div class="center-box-wrapper">
  <div class="form-card">
    <div class="card-top-links">
      <a href="index.html">← 返回主页</a>
      <a id="backLink" href="#">← 返回上一页</a>
    </div>

    <h1>添加子孙</h1>

    <div class="info-box" id="fatherInfo" style="display:none;">
      <div><span class="label">父亲：</span><span id="fatherName">—</span></div>
      <div><span class="label">父亲世代：</span>第<span id="fatherGen">—</span>代 → 儿子世代：第<span id="childGen">—</span>代</div>
    </div>

    <div class="form-row">
      <label class="form-label">华文名字 *</label>
      <input type="text" class="form-input" id="input_name" placeholder="例如：明辉">
    </div>

    <div class="form-row">
      <label class="form-label">兄弟排行</label>
      <input type="text" class="form-input" id="input_rank" placeholder="例如：1">
    </div>

    <div class="form-row">
      <label class="form-label">世代</label>
      <input type="text" class="form-input readonly" id="input_generation" readonly placeholder="自动计算">
      <div class="tip-text">由父亲世代 +1 自动填入</div>
    </div>

    <div class="form-row">
      <label class="form-label">妻子名字</label>
      <input type="text" class="form-input" id="input_wife" placeholder="可空">
    </div>

    <div class="form-row">
      <label class="form-label">儿子数量</label>
      <input type="text" class="form-input" id="input_sonCount" placeholder="0">
    </div>

    <div class="form-row">
      <label class="form-label">相片链接</label>
      <textarea class="form-input" id="input_photoLinks" rows="2" placeholder="多张用逗号隔开，可空"></textarea>
    </div>

    <div class="form-row">
      <label class="form-label">备注</label>
      <textarea class="form-input" id="input_note" rows="2" placeholder="可空"></textarea>
    </div>

    <div class="form-row">
      <label class="form-label">现居地</label>
      <input type="text" class="form-input" id="input_residence" placeholder="可空">
    </div>

    <div class="form-row">
      <label class="form-label">安葬地</label>
      <input type="text" class="form-input" id="input_burialPlace" placeholder="可空">
    </div>

    <div class="form-row">
      <label class="form-label">出生年份</label>
      <input type="text" class="form-input" id="input_birthYear" maxlength="4" placeholder="4位数字">
    </div>

    <div class="form-row">
      <label class="form-label">逝世年份</label>
      <input type="text" class="form-input" id="input_deathYear" maxlength="4" placeholder="在世则不填">
    </div>

    <div class="btn-row">
      <a class="btn btn-cancel" id="cancelBtn">取消</a>
      <button class="btn btn-submit" onclick="goToVerify()">提交资料</button>
    </div>
  </div>
</div>

<script>
// 读取 URL 参数：fatherId, fatherName, fatherGen
const params = new URLSearchParams(window.location.search);
const fatherId = params.get("fatherId") || "";
const fatherName = params.get("fatherName") || "";
const fatherGen = params.get("fatherGen") || "";

// 计算儿子世代
let childGen = "";
if(fatherGen && !isNaN(parseInt(fatherGen))){
  childGen = String(parseInt(fatherGen) + 1);
}

// 返回链接
document.getElementById("backLink").href = fatherId 
  ? `person.html?id=${encodeURIComponent(fatherId)}` 
  : "javascript:history.back()";
document.getElementById("cancelBtn").href = fatherId 
  ? `person.html?id=${encodeURIComponent(fatherId)}` 
  : "index.html";

// 显示父亲信息
if(fatherId && fatherName && fatherGen){
  document.getElementById("fatherInfo").style.display = "block";
  document.getElementById("fatherName").textContent = fatherName;
  document.getElementById("fatherGen").textContent = fatherGen;
  document.getElementById("childGen").textContent = childGen;
  document.getElementById("input_generation").value = childGen;
}

function goToVerify(){
  const name = document.getElementById("input_name").value.trim();
  const rank = document.getElementById("input_rank").value.trim();
  const wife = document.getElementById("input_wife").value.trim();
  const sonCount = document.getElementById("input_sonCount").value.trim() || "0";
  const photoLinks = document.getElementById("input_photoLinks").value.trim();
  const note = document.getElementById("input_note").value.trim();
  const residence = document.getElementById("input_residence").value.trim();
  const burialPlace = document.getElementById("input_burialPlace").value.trim();
  const birthYear = document.getElementById("input_birthYear").value.trim();
  const deathYear = document.getElementById("input_deathYear").value.trim();
  const generation = document.getElementById("input_generation").value.trim();

  if(!name){
    alert("请填写华文名字");
    return;
  }

  // 构建跳转链接，把所有资料传给 verify.html
  let url = "verify.html?type=3" +
    "&name=" + encodeURIComponent(name) +
    "&rank=" + encodeURIComponent(rank) +
    "&gen=" + encodeURIComponent(generation) +
    "&wife=" + encodeURIComponent(wife) +
    "&sonCount=" + encodeURIComponent(sonCount) +
    "&photoLinks=" + encodeURIComponent(photoLinks) +
    "&note=" + encodeURIComponent(note) +
    "&residence=" + encodeURIComponent(residence) +
    "&burialPlace=" + encodeURIComponent(burialPlace) +
    "&birthYear=" + encodeURIComponent(birthYear) +
    "&deathYear=" + encodeURIComponent(deathYear);

  // 如果有父亲信息，一并带上
  if(fatherId){
    url += "&fatherId=" + encodeURIComponent(fatherId);
  }

  window.location.href = url;
}
</script>

</body>
</html>
