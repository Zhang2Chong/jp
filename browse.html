<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱 - 世系浏览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.wrapper{
  max-width:600px;
  margin:0 auto;
  width:100%;
}

.header-fixed{
  flex:none;
  padding:16px 16px 8px;
  position:sticky;
  top:0;
  background:#1a1a1a;
  z-index:10;
}
.back-link{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
  display:inline-block;
  margin-bottom:20px;
}
h1{
  text-align:center;
  font-size:28px;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  font-size:16px;
  color:#ccc;
  margin-bottom:12px;
}
.divider-header{
  height:1px;
  background:#555;
  margin-bottom:12px;
}

.search-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  align-items:center;
}
.search-input{
  flex:1;
  padding:10px 12px;
  background:#2b2b2b;
  border:1px solid #555;
  border-radius:4px;
  color:#fff;
  font-size:15px;
  outline:none;
}
.search-input:focus{
  border-color:#ff9f29;
}
.search-btn{
  padding:10px 20px;
  background:#e64a19;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:15px;
  cursor:pointer;
  white-space:nowrap;
}
.reset-btn{
  padding:10px 16px;
  background:#555;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:15px;
  cursor:pointer;
  white-space:nowrap;
  display:none;
}

.search-result{
  margin-bottom:12px;
  padding:12px;
  background:#2b2b2b;
  border-radius:6px;
  display:none;
}
.search-result-title{
  font-size:14px;
  color:#888;
  margin-bottom:8px;
}
.search-item{
  padding:8px 12px;
  margin-bottom:4px;
  background:#333;
  border-radius:4px;
}
.search-item a{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}
.search-item a:hover{
  text-decoration:underline;
}
.no-result{
  color:#888;
  font-size:15px;
  text-align:center;
  padding:10px;
}

.scroll-content{
  flex:1;
  overflow-y:auto;
  padding:0 16px 20px;
}

.generation-block{
  margin-bottom:16px;
}
.gen-title{
  font-size:18px;
  color:#ff6b35;
  margin-bottom:8px;
  font-weight:bold;
}
.names-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px 0;
}
.person-item{
  font-size:16px;
  padding:2px 0;
  width:25%;
}
.person-item a{
  color:#facc54;
  text-decoration:none;
}
.person-item a:hover{
  text-decoration:underline;
}
.divider-gen{
  height:1px;
  background:#333;
  margin:8px 0 4px;
}

@media (max-width:480px){
  .person-item{width:50%;}
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="header-fixed">
    <a href="index.html" class="back-link">← 返回主页</a>
    <h1>张氏家谱</h1>
    <p class="subtitle">世系浏览 · 共<span id="totalGen">0</span>代 · 总计<span id="totalCount">0</span>人</p>
    
    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="输入名字（最多2个字）" maxlength="2">
      <button id="searchBtn" class="search-btn">寻找</button>
      <button id="resetBtn" class="reset-btn">返回全部</button>
    </div>
    
    <div id="searchResult" class="search-result">
      <div class="search-result-title">找到以下族人：</div>
      <div id="searchResultList"></div>
    </div>
    
    <div class="divider-header"></div>
  </div>

  <div class="scroll-content" id="content">
    <div style="text-align:center;color:#888;padding:40px">正在加载……</div>
  </div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";

function withSurname(name){
  if(!name) return "";
  const n=name.trim();
  if(n.startsWith("张")) return n;
  return "张"+n;
}

let allPeople = [];
let gens = {};
let maxGen = 0;

function showAllContent(){
  let html="";
  for(let g=1;g<=maxGen;g++){
    const gStr = String(g);
    const list = gens[gStr]||[];
    html += `<div class="generation-block">
      <div class="gen-title">第${gStr}代 ${list.length}人</div>
      <div class="names-grid">`;
    for(const p of list){
      html += `<div class="person-item"><a href="person.html?id=${p.no}">${withSurname(p.name)}</a></div>`;
    }
    html += `</div><div class="divider-gen"></div></div>`;
  }
  document.getElementById("content").innerHTML = html;
}

function searchName(keyword){
  if(!keyword.trim()){
    resetSearch();
    return;
  }
  const results = allPeople.filter(p=> p.name.includes(keyword));
  const resultDiv = document.getElementById("searchResult");
  const listDiv = document.getElementById("searchResultList");
  if(results.length === 0){
    listDiv.innerHTML = `<div class="no-result">没有找到匹配的族人</div>`;
  }else{
    listDiv.innerHTML = results.map(p=>
      `<div class="search-item">第${p.gen}代 — <a href="person.html?id=${p.no}">${withSurname(p.name)}</a></div>`
    ).join("");
  }
  resultDiv.style.display = "block";
  document.getElementById("resetBtn").style.display = "inline-block";
  document.getElementById("content").style.display = "none";
}

function resetSearch(){
  document.getElementById("searchResult").style.display = "none";
  document.getElementById("resetBtn").style.display = "none";
  document.getElementById("searchInput").value = "";
  document.getElementById("content").style.display = "block";
}

window.onload = async function(){
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    
    const sep = ",";
    const header = lines[0].split(sep).map(h => h.trim());
    
    const idxNo = header.indexOf("No");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");

    gens = {};
    allPeople = [];
    let total=0;
    maxGen=0;

    for(let i=1;i<lines.length;i++){
      const col = lines[i].split(sep);
      const no = idxNo>=0 && col[idxNo] ? col[idxNo].trim() : "";
      const name = idxName>=0 && col[idxName] ? col[idxName].trim() : "";
      const gen = idxGen>=0 && col[idxGen] ? col[idxGen].trim() : "";
      
      if(!no || !name || !gen) continue;
      
      if(!gens[gen]) gens[gen]=[];
      gens[gen].push({no,name});
      allPeople.push({no,name,gen});
      total++;
      
      const genNum = parseInt(gen);
      if(genNum>maxGen) maxGen=genNum;
    }

    document.getElementById("totalGen").textContent = maxGen;
    document.getElementById("totalCount").textContent = total;
    showAllContent();

    document.getElementById("searchBtn").addEventListener("click", ()=>{
      searchName(document.getElementById("searchInput").value);
    });
    document.getElementById("searchInput").addEventListener("keydown", (e)=>{
      if(e.key === "Enter") searchName(document.getElementById("searchInput").value);
    });
    document.getElementById("resetBtn").addEventListener("click", resetSearch);

  }catch(err){
    document.getElementById("content").innerHTML = `<div style="text-align:center;color:#f66;padding:40px">加载失败：${err.message}</div>`;
  }
};
</script>

</body>
</html>
