<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱 - 世系浏览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#ffdd66;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;padding:16px}
.container{max-width:700px;margin:0 auto}
.nav-links{display:flex;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.back-link{color:#ff9933;text-decoration:none;font-size:16px}
.back-link:hover{color:#ffcc66}

h1{text-align:center;font-size:28px;color:#ffdd66;margin-bottom:4px}
h2{text-align:center;font-size:20px;color:#ffdd66;margin-bottom:12px;font-weight:normal}
.summary-line{text-align:center;color:#aaa;font-size:15px;padding-bottom:12px;border-bottom:1px solid #444;margin-bottom:20px}

.generation-block{margin-bottom:24px}
.gen-header{display:flex;align-items:baseline;border-bottom:1px solid #444;padding-bottom:6px;margin-bottom:10px}
.gen-title{font-size:18px;color:#ff6633;font-weight:bold}
.gen-count{margin-left:10px;font-size:15px;color:#999}
.names-grid{display:flex;flex-wrap:wrap;gap:8px 20px}
.person-link{font-size:16px;color:#ffdd66;text-decoration:none;padding:4px 0;transition:color 0.2s;white-space:nowrap;flex:0 0 calc(25% - 15px)}
.person-link:hover{color:#fff;text-decoration:underline}
@media (max-width:520px){.person-link{flex:0 0 calc(50% - 10px)}}
.loading{text-align:center;color:#888;padding:60px 20px;font-size:16px}
</style>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a class="back-link" href="index.html">← 返回首页</a>
    <div></div>
  </div>

  <h1>张氏家谱</h1>
  <h2>世系浏览</h2>
  <div id="summary" class="summary-line">正在统计……</div>
  <div id="content" class="loading">正在加载家谱数据……</div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
window.onload = async function(){
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    if(lines.length<2){
      document.getElementById("content").innerHTML="<div style='text-align:center;color:#888;'>暂无家谱数据</div>";
      return;
    }
    const header=lines[0].split(",");
    const idxId=header.indexOf("编号");
    const idxName=header.indexOf("姓名");
    const idxGen=header.indexOf("世代");
    const peopleByGen={};
    let totalPeople=0;
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(",");
      let id=(idxId>=0 && cols[idxId]) ? cols[idxId].trim() : "";
      const name=cols[idxName] ? cols[idxName].trim() : "";
      const gen=cols[idxGen] ? parseInt(cols[idxGen].trim()) : NaN;
      if(!name || isNaN(gen)) continue;
      if(!id) id="row_"+i;
      if(!peopleByGen[gen]) peopleByGen[gen]=[];
      peopleByGen[gen].push({id,name});
      totalPeople++;
    }
    const gens=Object.keys(peopleByGen).sort((a,b)=>parseInt(a)-parseInt(b));
    const totalGens=gens.length;
    document.getElementById("summary").innerHTML=`共 ${totalGens} 代 · 总计 ${totalPeople} 人`;
    
    let html="";
    for(const gen of gens){
      const list=peopleByGen[gen];
      html+=`<div class="generation-block"><div class="gen-header"><div class="gen-title">第${gen}代</div><div class="gen-count">${list.length}人</div></div><div class="names-grid">`;
      for(const p of list){
        html+=`<a class="person-link" href="person.html?id=${encodeURIComponent(p.id)}">${p.name}</a>`;
      }
      html+="</div></div>";
    }
    document.getElementById("content").className="";
    document.getElementById("content").innerHTML=html;
  }catch(err){
    document.getElementById("content").innerHTML=`<div style='text-align:center;color:#f66;'>加载失败：${err.message}</div>`;
  }
};
</script>
</body>
</html>
