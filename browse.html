<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱 - 世系浏览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.wrapper{
  max-width:600px;
  margin:0 auto;
  width:100%;
}

.header-fixed{
  flex:none;
  padding:16px 16px 8px;
  position:sticky;
  top:0;
  background:#1a1a1a;
  z-index:10;
}
.back-link{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
  display:inline-block;
  margin-bottom:20px;
}
h1{
  text-align:center;
  font-size:28px;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  font-size:16px;
  color:#ccc;
  margin-bottom:12px;
}
.divider-header{
  height:1px;
  background:#555;
  margin-bottom:8px;
}

.scroll-content{
  flex:1;
  overflow-y:auto;
  padding:0 16px 20px;
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="header-fixed">
    <a href="index.html" class="back-link">← 返回首页</a>
    <h1>张氏家谱</h1>
    <p class="subtitle">世系浏览 · 共<span id="totalGen">0</span>代 · 总计<span id="totalCount">0</span>人</p>
    <div class="divider-header"></div>
  </div>

  <div class="scroll-content" id="content">
    <div style="text-align:center;color:#888;padding:40px">正在加载……</div>
  </div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";

function withSurname(name){
  if(!name) return "";
  const n=name.trim();
  if(n.startsWith("张")) return n;
  return "张"+n;
}

window.onload = async function(){
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split("\n");
    const header = lines[0].split(",");
    
    const idxNo = header.indexOf("No");
    const idxName = header.indexOf("姓名");
    const idxGen = header.indexOf("世代");

    const gens = {};
    let total=0, maxGen=0;

    for(let i=2;i<lines.length;i++){
      const col = lines[i].split(",");
      const no = idxNo>=0 && col[idxNo] ? col[idxNo].trim() : "";
      const name = idxName>=0 && col[idxName] ? col[idxName].trim() : "";
      const gen = idxGen>=0 && col[idxGen] ? col[idxGen].trim() : "";
      if(!no || !name || !gen) continue;
      
      if(!gens[gen]) gens[gen]=[];
      gens[gen].push({no,name});
      total++;
      if(parseInt(gen)>maxGen) maxGen=parseInt(gen);
    }

    document.getElementById("totalGen").textContent = maxGen;
    document.getElementById("totalCount").textContent = total;

    let html="";
    for(let g=1;g<=maxGen;g++){
      const gStr = String(g);
      const list = gens[gStr]||[];
      html += `<div style="margin-bottom:20px">
        <div style="font-size:18px;color:#ff6b35;margin-bottom:10px;font-weight:bold">第${gStr}代 ${list.length}人</div>`;
      for(const p of list){
        html += `<div style="font-size:17px;padding:4px 0 4px 20px">
          <a href="person.html?id=${p.no}" style="color:#facc54;text-decoration:none">${withSurname(p.name)}</a>
        </div>`;
      }
      html += `<div style="height:1px;background:#333;margin:8px 0"></div></div>`;
    }
    document.getElementById("content").innerHTML = html;

  }catch(err){
    document.getElementById("content").innerHTML = `<div style="text-align:center;color:#f66;padding:40px">加载失败：${err.message}</div>`;
  }
};
</script>

</body>
</html>
