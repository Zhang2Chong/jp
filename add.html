<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加子孙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#1a1a1a;
    color:#facc54;
    font-family:"Microsoft YaHei",sans-serif;
    padding:20px 15px;
}

.form-container{
    max-width:420px;
    margin:0 auto;
    background:#2b2b2b;
    border-radius:8px;
    padding:20px;
}

.top-links{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    padding-bottom:15px;
    border-bottom:1px solid #444;
}
.top-links a{
    color:#ff9f29;
    text-decoration:none;
    font-size:15px;
}

h2{
    text-align:center;
    font-size:20px;
    margin-bottom:25px;
    color:#ffcc44;
}

.form-row{
    display:flex;
    align-items:center;
    margin-bottom:14px;
}
.form-label{
    width:90px;
    color:#ddd;
    flex-shrink:0;
}
.form-input{
    flex:1;
    padding:10px 12px;
    border:1px solid #555;
    border-radius:4px;
    background:#333;
    color:#fff;
    font-size:16px;
    width:100%;
}
.form-input:focus{
    outline:none;
    border-color:#ff9f29;
}
.form-text{
    flex:1;
    padding:10px 12px;
    color:#fff;
    font-size:16px;
}
.btn-submit {
    background-color: #e62121;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 11px 22px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 18px;
    width: 100%;
}
.btn-submit:hover {
    background-color: #c81919;
}
</style>
</head>
<body>

<div class="form-container">

    <div class="top-links">
        <a href="index.html">← 返回主页</a>
        <a href="javascript:goBackToPerson();">← 返回上一页</a>
    </div>

    <h2>添加子孙</h2>

    <form id="addForm">
        <div class="form-row">
            <div class="form-label">华文名字</div>
            <input type="text" class="form-input" id="name" maxlength="2" required placeholder="最多2个字">
        </div>

        <div class="form-row">
            <div class="form-label">父亲</div>
            <div class="form-text" id="fatherFullName">—</div>
        </div>

        <div class="form-row">
            <div class="form-label">兄弟排行</div>
            <input type="text" class="form-input" id="birthOrder" value="1" placeholder="1可附加编号，2-19只允许纯数字">
        </div>

        <div class="form-row">
            <div class="form-label">世代</div>
            <div class="form-text" id="generationText">—</div>
        </div>

        <div class="form-row">
            <div class="form-label">妻子名字</div>
            <input type="text" class="form-input" id="wifeName" maxlength="4" placeholder="可空，最多4个字">
        </div>

        <button type="submit" class="btn-submit">提交资料</button>
    </form>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/jp/main/ZhangList.csv";

const params = new URLSearchParams(window.location.search);
const fatherId = params.get('fatherId');
let fatherName = "";
let childGenNumber = "";

function withSurname(name){
    if(!name) return "";
    const n = name.trim();
    if(n.startsWith("张")) return n;
    return "张" + n;
}

function goBackToPerson(){
    if(fatherId){
        window.location.href = "person.html?id=" + encodeURIComponent(fatherId);
    }else{
        window.location.href = "index.html";
    }
}

async function loadFatherInfo() {
    if (!fatherId) {
        document.getElementById('fatherFullName').textContent = '未指定';
        document.getElementById('generationText').textContent = '—';
        return;
    }

    try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const lines = text.trim().split('\n');
        const header = lines[0].split(',');
        
        const idxNo = header.indexOf('No');
        const idxName = header.indexOf('姓名');
        const idxGen = header.indexOf('世代');
        
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            const no = idxNo >= 0 && cols[idxNo] ? cols[idxNo].trim() : '';
            
            if (no === fatherId) {
                fatherName = idxName >= 0 ? cols[idxName].trim() : '';
                const gen = idxGen >= 0 ? parseInt(cols[idxGen].trim()) : 0;
                childGenNumber = String(gen + 1);
                
                document.getElementById('fatherFullName').textContent = withSurname(fatherName);
                document.getElementById('generationText').textContent = '第' + childGenNumber + '代';
                return;
            }
        }
        
        document.getElementById('fatherFullName').textContent = '查无此人';
        document.getElementById('generationText').textContent = '—';
    } catch (err) {
        console.error('读取失败:', err);
        document.getElementById('fatherFullName').textContent = '读取失败';
        document.getElementById('generationText').textContent = '—';
    }
}

const nameInput = document.getElementById("name");
nameInput.addEventListener("input", function () {
    this.value = this.value.replace(/[^\u4e00-\u9fa5]/g, "");
});

const wifeInput = document.getElementById("wifeName");
wifeInput.addEventListener("input", function () {
    this.value = this.value.replace(/[^\u4e00-\u9fa5]/g, "");
});

document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const birthOrder = document.getElementById('birthOrder').value.trim();
    const generation = childGenNumber;
    const wifeName = document.getElementById('wifeName').value.trim();
    const chineseReg = /^[\u4e00-\u9fa5]{1,2}$/;
    const wifeReg = /^[\u4e00-\u9fa5]{0,4}$/;
    
    if(!name){
        alert('请输入华文名字');
        return;
    }
    if (!chineseReg.test(name)) {
        alert('华文名字只能够输入中文汉字，一至两个字');
        return;
    }
    if(wifeName && !wifeReg.test(wifeName)){
        alert('妻子名字只能够输入中文汉字，最多四个字');
        return;
    }

    // 和 modify 页面同一套校验规则
    const baseMatch = birthOrder.match(/^(\d+)/);
    if(!baseMatch){
        alert("兄弟排行开头必须是数字");
        return;
    }
    const baseNum = parseInt(baseMatch[1]);
    if(baseNum < 1 || baseNum > 19){
        alert("兄弟排行基础数字必须在1～19之间");
        return;
    }
    // 2~19 只能纯数字，不能带后缀
    if(baseNum >=2 && birthOrder !== String(baseNum)){
        alert("排行2到19只可以填纯数字，不能加别的编号");
        return;
    }

    window.location.href = "verify.html?type=3" +
        "&fatherId=" + encodeURIComponent(fatherId || "") +
        "&name=" + encodeURIComponent(name) +
        "&rank=" + encodeURIComponent(birthOrder) +
        "&gen=" + encodeURIComponent(generation) +
        "&wife=" + encodeURIComponent(wifeName) +
        "&residence=" +
        "&birthYear=" +
        "&burialPlace=" +
        "&deathYear=" +
        "&photoLinks=";
});

loadFatherInfo();

</script>

</body>
</html>
