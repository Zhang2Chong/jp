<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#ffdd66;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:80px 24px 40px;
}
.container{
  max-width:600px;
  margin:0 auto;
  text-align:center;
}
h1{
  font-size:clamp(36px,12vw,52px);
  margin-bottom:16px;
  color:#ffdd66;
  letter-spacing:4px;
}
.author{
  font-size:clamp(20px,5vw,24px);
  margin-bottom:60px;
  color:#e2b558;
}
.btn{
  display:block;
  width:100%;
  padding:22px;
  margin:18px 0;
  border:none;
  border-radius:12px;
  font-size:clamp(22px,6vw,28px);
  color:white;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
}
.btn-1{background:#ff8800}
.btn-2{background:#2288ff}

/* QR区域样式 */
.qr-area{
  margin-top:40px;
  padding:20px;
}
.qr-title{
  color:#ffdd66;
  font-size:16px;
  margin-bottom:12px;
  letter-spacing:3px;
}
#qrcode{
  display:inline-block;
  background:#222;
  padding:10px;
  border-radius:8px;
}
.qr-tip{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
}

.footer-note{
  margin-top:40px;
  padding-top:24px;
  border-top:1px solid #333;
  color:#999;
  font-size:14px;
  line-height:1.8;
}
</style>
</head>
<body>
<div class="container">
<h1>张氏家谱</h1>
<div class="author">编撰：张官来</div>

<a class="btn btn-1" href="browse.html">📖 浏览世代族谱</a>
<a class="btn btn-2" href="compare.html">⚖️ 两人血缘对比</a>

<!-- 二维码放在两个按钮下面、版权上面 -->
<div class="qr-area">
  <div class="qr-title">三维家谱外墙入口</div>
  <canvas id="qrcode"></canvas>
  <div class="qr-tip">手机 / iPad 扫码打开 index-wall</div>
</div>

<div class="footer-note">
张氏家谱 · 编撰：张官来<br>
所有内容仅供张氏族人查阅传承，保留所有权利
</div>
</div>

<script>
// 这里改成你index-wall的链接
const targetUrl = "https://xxx.github.io/xxx/index-wall.html";
QRCode.toCanvas(document.getElementById('qrcode'), targetUrl, {
  width:200,
  margin:2,
  color:{
    dark:"#ffdd66",
    light:"#222222"
  }
}, function(err){
  if(err) console.error(err)
})
</script>
</body>
</html>
