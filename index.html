<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张氏家谱</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#ffdd66;
  font-family:"Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:80px 24px 40px;
}
.container{
  max-width:600px;
  margin:0 auto;
  text-align:center;
}
h1{
  font-size:clamp(36px,12vw,52px);
  margin-bottom:16px;
  color:#ffdd66;
  letter-spacing:4px;
}
.author{
  font-size:clamp(20px,5vw,24px);
  margin-bottom:60px;
  color:#e2b558;
}
.btn{
  display:block;
  width:100%;
  padding:22px;
  margin:18px 0;
  border:none;
  border-radius:12px;
  font-size:clamp(22px,6vw,28px);
  color:white;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
}
.btn-1{background:#ff8800}
.btn-2{background:#2288ff}

.qr-area{
  margin-top:30px;
}
#qrcode{
  display:inline-block;
  background:#222;
  padding:8px;
  border-radius:6px;
}

.footer-note{
  margin-top:40px;
  padding-top:24px;
  border-top:1px solid #333;
  color:#999;
  font-size:14px;
  line-height:1.8;
}
</style>
</head>
<body>
<div class="container">
<h1>张氏家谱</h1>
<div class="author">编撰：张官来</div>

<a class="btn btn-1" href="browse.html">📖 浏览世代族谱</a>
<a class="btn btn-2" href="compare.html">⚖️ 两人血缘对比</a>

<div class="qr-area">
  <canvas id="qrcode"></canvas>
</div>

<div class="footer-note">
张氏家谱 · 编撰：张官来<br>
所有内容仅供张氏族人查阅传承，保留所有权利
</div>
</div>

<script>
// 二维码指向分流页自己
const targetUrl = "https://zhang2chong.github.io/jp/redirect/index-redirect.html";
const logoSrc = "assets/family-icon.png";

QRCode.toCanvas(document.getElementById('qrcode'), targetUrl, {
  width:180,
  margin:2,
  color:{
    dark:"#ffdd66",
    light:"#222222"
  }
}, function(err){
  if(err) console.error(err);
  drawLogo();
});

function drawLogo(){
  const canvas = document.getElementById('qrcode');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.src = logoSrc;
  img.onload = function(){
    const size = canvas.width * 0.22;
    const x = (canvas.width - size) / 2;
    const y = (canvas.height - size) / 2;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.roundRect(x - 4, y - 4, size + 8, size + 8, 6);
    ctx.fill();
    ctx.drawImage(img, x, y, size, size);
  };
}
</script>
</body>
</html>
