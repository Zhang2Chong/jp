<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改资料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#facc54;
  font-family:"Microsoft YaHei",sans-serif;
  padding:16px;
}
.wrapper{
  max-width:600px;
  margin:0 auto;
  width:100%;
}
.top-links{
  display:flex;
  justify-content:space-between;
  margin-bottom:24px;
  padding-bottom:12px;
  border-bottom:1px solid #444;
}
.top-links a{
  color:#ff9f29;
  text-decoration:none;
  font-size:16px;
}
h1{
  text-align:center;
  font-size:26px;
  margin-bottom:24px;
  color:#ffcc44;
}
.form-row{
  display:flex;
  align-items:center;
  margin-bottom:12px;
  gap:10px;
}
.form-label{
  width:90px;
  color:#ddd;
  flex-shrink:0;
}
.form-input-wrap{
  flex:1;
}
.form-input{
  width:100%;
  padding:10px 12px;
  background:#2b2b2b;
  border:1px solid #555;
  border-radius:4px;
  color:#fff;
  font-size:15px;
  outline:none;
}
.form-input:focus{
  border-color:#ff9f29;
}
.form-input.short{
  max-width:120px;
}
.form-original{
  width:40%;
  padding:10px 12px;
  background:#222;
  border-radius:4px;
  color:#aaa;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.tip-text{
  font-size:12px;
  color:#777;
  margin-bottom:4px;
  margin-left:100px;
}
.btn-block{
  margin-top:24px;
}
.submit-btn{
  width:100%;
  padding:14px;
  background:#e64a19;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:18px;
  cursor:pointer;
}
.info-box{
  background:#2b2b2b;
  padding:12px;
  border-radius:4px;
  margin-bottom:16px;
  color:#88ff88;
  font-size:14px;
  display:none;
}
.info-box.error{
  color:#ff6b6b;
}
.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
}
</style>
</head>
<body>
<div class="wrapper">

<div class="top-links">
  <a href="index.html">← 返回主页</a>
  <a id="backToPerson" href="#">← 返回上一页</a>
</div>

<h1>修改资料</h1>

<div id="loadingBox" class="loading">正在加载资料...</div>
<div id="formBox" style="display:none;">

  <div class="form-row">
    <div class="form-label">华文名字</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input" id="input_name" placeholder="输入新名字，不改则留空">
    </div>
    <div class="form-original" id="orig_name">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">父亲</div>
    <div style="flex:1;"></div>
    <div class="form-original" id="orig_father">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">兄弟排行</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input" id="input_rank" placeholder="输入新排行，不改则留空">
    </div>
    <div class="form-original" id="orig_rank">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">世代</div>
    <div style="flex:1;"></div>
    <div class="form-original" id="orig_gen">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">妻子名字</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input" id="input_wife" placeholder="输入新妻子名，不改则留空">
    </div>
    <div class="form-original" id="orig_wife">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">儿子数量</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input" id="input_sonCount" placeholder="输入新数量，不改则留空">
    </div>
    <div class="form-original" id="orig_sonCount">—</div>
  </div>

  <div class="tip-text">相片链接：多个用逗号分开，不改则留空</div>
  <div class="form-row">
    <div class="form-label">相片链接</div>
    <div class="form-input-wrap">
      <textarea class="form-input" id="input_photoLinks" rows="3" placeholder="不改则留空"></textarea>
    </div>
    <div class="form-original" id="orig_photoLinks">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">备注</div>
    <div class="form-input-wrap">
      <textarea class="form-input" id="input_note" rows="3" placeholder="输入新备注，不改则留空"></textarea>
    </div>
    <div class="form-original" id="orig_note">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">现居地</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input" id="input_residence" placeholder="不改则留空">
    </div>
    <div class="form-original" id="orig_residence">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">安葬地</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input" id="input_burialPlace" placeholder="不改则留空">
    </div>
    <div class="form-original" id="orig_burialPlace">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">出生年份</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input short" id="input_birthYear" maxlength="4" placeholder="4位数字">
    </div>
    <div class="form-original" id="orig_birthYear">—</div>
  </div>

  <div class="form-row">
    <div class="form-label">去世年份</div>
    <div class="form-input-wrap">
      <input type="text" class="form-input short" id="input_deathYear" maxlength="4" placeholder="4位数字">
    </div>
    <div class="form-original" id="orig_deathYear">—</div>
  </div>

  <div class="info-box" id="infoBox"></div>

  <div class="btn-block">
    <button class="submit-btn" id="submitBtn">提交资料</button>
  </div>

</div>

</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/zhang2chong/ZhangFamily/main/ZhangFamilyList.csv";
let targetId = null;
let people = {};
let originalData = null;

function withSurname(name){
  if(!name) return "";
  const n=name.trim();
  if(n.startsWith("张")) return n;
  return "张"+n;
}

function showInfo(msg, isError=false){
  const box = document.getElementById('infoBox');
  box.style.display = 'block';
  if(isError){
    box.classList.add('error');
  }else{
    box.classList.remove('error');
  }
  box.textContent = msg;
  
  if(isError){
    setTimeout(()=>{
      box.style.display = 'none';
    }, 2500);
  }
}

function parseCSV(text){
  const lines = text.trim().split("\n");
  const sep = lines[0].indexOf("\t") >= 0 ? "\t" : ",";
  const header = lines[0].split(sep);
  const idx = {};
  ['No','姓名','父亲编号','兄弟排名','世代','妻子','儿子数量','相片链接','备注','现居地','安葬地','出生年份','去世年份'].forEach(col=>{
    idx[col] = header.indexOf(col);
  });
  const data = {};
  for(let i=1;i<lines.length;i++){
    const col = lines[i].split(sep);
    const no = idx['No']>=0 && col[idx['No']] ? col[idx['No']].trim() : "";
    if(!no) continue;
    data[no] = {
      no: no,
      name: idx['姓名']>=0 && col[idx['姓名']] ? col[idx['姓名']].trim() : "",
      fatherId: idx['父亲编号']>=0 && col[idx['父亲编号']] ? col[idx['父亲编号']].trim() : "",
      rank: idx['兄弟排名']>=0 && col[idx['兄弟排名']] ? col[idx['兄弟排名']].trim() : "",
      gen: idx['世代']>=0 && col[idx['世代']] ? col[idx['世代']].trim() : "",
      wife: idx['妻子']>=0 && col[idx['妻子']] ? col[idx['妻子']].trim() : "",
      sonCount: idx['儿子数量']>=0 && col[idx['儿子数量']] ? col[idx['儿子数量']].trim() : "",
      photoLinks: idx['相片链接']>=0 && col[idx['相片链接']] ? col[idx['相片链接']].trim() : "",
      note: idx['备注']>=0 && col[idx['备注']] ? col[idx['备注']].trim() : "",
      residence: idx['现居地']>=0 && col[idx['现居地']] ? col[idx['现居地']].trim() : "",
      burialPlace: idx['安葬地']>=0 && col[idx['安葬地']] ? col[idx['安葬地']].trim() : "",
      birthYear: idx['出生年份']>=0 && col[idx['出生年份']] ? col[idx['出生年份']].trim() : "",
      deathYear: idx['去世年份']>=0 && col[idx['去世年份']] ? col[idx['去世年份']].trim() : ""
    };
  }
  return data;
}

window.onload = async function(){
  const params = new URLSearchParams(location.search);
  targetId = params.get("id")?.replace(/#.*$/, "") || null;
  
  document.getElementById('backToPerson').href = targetId 
    ? "person.html?id=" + encodeURIComponent(targetId) 
    : "index.html";
  
  if(!targetId){
    document.getElementById('loadingBox').textContent = '缺少编号参数';
    return;
  }

  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    people = parseCSV(text);
    
    originalData = people[targetId];
    if(!originalData){
      document.getElementById('loadingBox').textContent = '查无此记录：' + targetId;
      return;
    }

    const father = originalData.fatherId && originalData.fatherId !== "0" ? people[originalData.fatherId] : null;

    document.getElementById('orig_name').textContent = withSurname(originalData.name);
    document.getElementById('orig_father').textContent = father ? withSurname(father.name) : "—";
    document.getElementById('orig_rank').textContent = originalData.rank || "—";
    document.getElementById('orig_gen').textContent = '第' + originalData.gen + '代';
    document.getElementById('orig_wife').textContent = originalData.wife || "—";
    document.getElementById('orig_sonCount').textContent = originalData.sonCount || "0";
    
    const photoCount = originalData.photoLinks ? originalData.photoLinks.split(/[,，]+/).filter(s=>s.trim()).length : 0;
    document.getElementById('orig_photoLinks').textContent = photoCount > 0 ? `已存${photoCount}张` : "暂无相片";
    
    const exampleId = targetId;
    document.getElementById('input_photoLinks').setAttribute('placeholder', 
      `例如：${exampleId}A.jpg, ${exampleId}B.jpg, ${exampleId}C.jpg`);
    
    document.getElementById('orig_note').textContent = originalData.note || "暂无备注";
    
    document.getElementById('input_residence').value = originalData.residence || "";
    document.getElementById('orig_residence').textContent = originalData.residence || "暂无";
    document.getElementById('input_burialPlace').value = originalData.burialPlace || "";
    document.getElementById('orig_burialPlace').textContent = originalData.burialPlace || "暂无";
    document.getElementById('input_birthYear').value = originalData.birthYear || "";
    document.getElementById('orig_birthYear').textContent = originalData.birthYear || "暂无";
    document.getElementById('input_deathYear').value = originalData.deathYear || "";
    document.getElementById('orig_deathYear').textContent = originalData.deathYear || "暂无";

    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('formBox').style.display = 'block';

  }catch(err){
    console.error(err);
    document.getElementById('loadingBox').textContent = '加载失败：' + err.message;
  }
};

document.getElementById('submitBtn').addEventListener('click', function(){
  const changes = {};
  
  const newName = document.getElementById('input_name').value.trim();
  const newRank = document.getElementById('input_rank').value.trim();
  const newWife = document.getElementById('input_wife').value.trim();
  const newSonCount = document.getElementById('input_sonCount').value.trim();
  const newPhotos = document.getElementById('input_photoLinks').value.trim();
  const newNote = document.getElementById('input_note').value.trim();
  const newResidence = document.getElementById('input_residence').value.trim();
  const newBurialPlace = document.getElementById('input_burialPlace').value.trim();
  const newBirthYear = document.getElementById('input_birthYear').value.trim();
  const newDeathYear = document.getElementById('input_deathYear').value.trim();

  if(newName && newName !== originalData.name) changes.name = newName;
  if(newRank && newRank !== originalData.rank) changes.rank = newRank;
  if(newWife !== '' && newWife !== originalData.wife) changes.wife = newWife;
  if(newSonCount !== '' && newSonCount !== originalData.sonCount) changes.sonCount = newSonCount;
  if(newPhotos && newPhotos !== originalData.photoLinks) changes.photoLinks = newPhotos;
  if(newNote !== '' && newNote !== originalData.note) changes.note = newNote;
  if(newResidence !== '' && newResidence !== originalData.residence) changes.residence = newResidence;
  if(newBurialPlace !== '' && newBurialPlace !== originalData.burialPlace) changes.burialPlace = newBurialPlace;
  if(newBirthYear !== '' && newBirthYear !== originalData.birthYear) changes.birthYear = newBirthYear;
  if(newDeathYear !== '' && newDeathYear !== originalData.deathYear) changes.deathYear = newDeathYear;

  if(Object.keys(changes).length === 0){
    showInfo('您没有修改任何内容', true);
    return;
  }

  window.location.href = "verify.html?type=4" +
    "&id=" + encodeURIComponent(targetId) +
    "&name=" + encodeURIComponent(changes.name || originalData.name) +
    "&fatherName=" + encodeURIComponent(
      (originalData.fatherId && originalData.fatherId !== "0" && people[originalData.fatherId])
        ? people[originalData.fatherId].name : ""
    ) +
    "&rank=" + encodeURIComponent(changes.rank || originalData.rank) +
    "&gen=" + encodeURIComponent(originalData.gen) +
    "&wife=" + encodeURIComponent(changes.wife || originalData.wife) +
    "&sonCount=" + encodeURIComponent(changes.sonCount || originalData.sonCount) +
    "&photo=" + encodeURIComponent(changes.photoLinks || originalData.photoLinks) +
    "&note=" + encodeURIComponent(changes.note || originalData.note) +
    "&residence=" + encodeURIComponent(changes.residence || originalData.residence) +
    "&burialPlace=" + encodeURIComponent(changes.burialPlace || originalData.burialPlace) +
    "&birthYear=" + encodeURIComponent(changes.birthYear || originalData.birthYear) +
    "&deathYear=" + encodeURIComponent(changes.deathYear || originalData.deathYear);
});
</script>

</body>
</html>
